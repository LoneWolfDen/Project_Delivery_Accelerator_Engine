<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contexta v2 – Project Delivery Accelerator</title>

<style>
/* ─── Design tokens (identical to index.html) ─────────────────────── */
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--surface3:#30363d;
  --border:#30363d;--border2:#484f58;--text:#e6edf3;--text-dim:#8b949e;
  --text-muted:#6e7681;--accent:#58a6ff;--accent-dim:#1f6feb;
  --green:#3fb950;--green-dim:#238636;--yellow:#d29922;--red:#f85149;
  --purple:#bc8cff;--radius:6px;--radius-lg:10px;
  --shadow:0 4px 16px rgba(0,0,0,.4);--transition:.15s ease;
}

/* ─── Reset ───────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:13px;}

/* ─── Header ──────────────────────────────────────────────────────── */
header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  min-height:48px;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 4px rgba(0,0,0,.5);}
.logo{font-size:15px;font-weight:700;white-space:nowrap;letter-spacing:-.3px;}
.logo span{color:var(--accent);}
.v2-badge{font-size:9px;font-weight:700;background:var(--accent-dim);
  color:var(--accent);padding:1px 6px;border-radius:20px;letter-spacing:.4px;}
.phase-badge{background:var(--accent-dim);color:var(--accent);padding:2px 10px;
  border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;}
.proj-select{background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:5px 10px;border-radius:var(--radius);
  font-size:12px;cursor:pointer;}
.proj-select:focus{outline:none;border-color:var(--accent);}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;}
nav button{background:transparent;color:var(--text-dim);border:none;
  padding:6px 11px;border-radius:var(--radius);cursor:pointer;
  font-size:12px;font-weight:500;transition:background var(--transition),color var(--transition);}
nav button:hover{background:var(--surface2);color:var(--text);}
nav button.active{background:var(--surface2);color:var(--accent);}

/* ─── Compare button in header ────────────────────────────────────── */
.btn-compare{display:inline-flex;align-items:center;gap:5px;
  background:transparent;color:var(--accent);border:1px solid var(--accent-dim);
  padding:5px 12px;border-radius:var(--radius);cursor:pointer;
  font-size:12px;font-weight:600;transition:all var(--transition);white-space:nowrap;}
.btn-compare:hover{background:rgba(88,166,255,.1);border-color:var(--accent);}
.btn-compare:disabled{opacity:.4;cursor:not-allowed;}
.btn-compare .cmp-icon{font-size:13px;}
</style>

<style>
/* ─── Quick Navigation Search (.qs-*) ─────────────────────────────── */
.qs-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0;}
.qs-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:14px;pointer-events:none;z-index:1;}
.qs-input{width:170px;padding:5px 10px 5px 26px;font-size:12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-family:inherit;transition:width .2s ease,border-color var(--transition);
  appearance:none;-webkit-appearance:none;}
.qs-input:focus{outline:none;width:210px;border-color:var(--accent);
  background:var(--surface);box-shadow:0 0 0 3px rgba(88,166,255,.12);}
.qs-input::-webkit-search-cancel-button{display:none;}
.qs-input::placeholder{color:var(--text-muted);}
.qs-dropdown{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;max-width:320px;
  max-height:240px;overflow-y:auto;background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);z-index:200;padding:3px 0;}
.qs-dropdown::-webkit-scrollbar{width:4px;}
.qs-dropdown::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.qs-item{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;
  font-size:12px;color:var(--text);transition:background var(--transition);user-select:none;}
.qs-item:hover,.qs-item-active{background:rgba(88,166,255,.08);}
.qs-item-icon{font-size:13px;width:17px;text-align:center;flex-shrink:0;}
.qs-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--text-dim);}
.qs-highlight{color:var(--accent);font-weight:700;background:transparent;}
.qs-type-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:1px 6px;border-radius:20px;flex-shrink:0;}
.qs-type-version{background:rgba(88,166,255,.12);color:var(--accent);}
.qs-type-review{background:rgba(188,140,255,.12);color:var(--purple);}
.qs-empty{padding:10px 14px;font-size:11px;color:var(--text-muted);text-align:center;}
.qs-empty em{font-style:normal;font-weight:600;color:var(--accent);}
/* pulse on navigation target */
@keyframes qs-pulse{
  0%  {box-shadow:0 0 0 0   rgba(88,166,255,.55);}
  50% {box-shadow:0 0 0 6px rgba(88,166,255,.18);}
  100%{box-shadow:0 0 0 0   rgba(88,166,255,.00);}
}
.qs-active-target{animation:qs-pulse .7s ease-out 2;
  border-color:var(--accent)!important;outline:2px solid rgba(88,166,255,.2);outline-offset:1px;}
</style>

<style>
/* ─── Layout ──────────────────────────────────────────────────────── */
main{max-width:1080px;margin:0 auto;padding:20px 16px;}

/* ─── Cards ───────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;}
.card-title{font-size:13px;font-weight:600;color:var(--text);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card-title .icon{font-size:15px;}
.card-subtitle{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
.card-section{font-size:11px;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.6px;margin:10px 0 5px;}

/* ─── Stat grid ───────────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
.stat{background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:12px 14px;text-align:center;cursor:pointer;
  transition:border-color var(--transition),background var(--transition);}
.stat:hover{border-color:var(--accent);background:var(--surface3);}
.stat .num{font-size:26px;font-weight:700;color:var(--accent);line-height:1.2;}
.stat .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.5px;margin-top:2px;}
.stat.green .num{color:var(--green);}
.stat.yellow .num{color:var(--yellow);}
.stat.red .num{color:var(--red);}
.stat.purple .num{color:var(--purple);}
</style>


<style>
/* ─── Buttons ─────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:5px;background:var(--accent);
  color:#000;border:none;padding:6px 14px;border-radius:var(--radius);
  cursor:pointer;font-size:12px;font-weight:600;transition:opacity var(--transition);}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-xs{padding:2px 8px;font-size:10px;border-radius:4px;}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-outline:hover{background:rgba(88,166,255,.08);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.btn-green{background:var(--green-dim);color:#fff;}
.btn-red{background:var(--red);color:#fff;}

/* ─── Forms ───────────────────────────────────────────────────────── */
input,select,textarea{background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:6px 10px;border-radius:var(--radius);
  font-size:12px;width:100%;transition:border-color var(--transition);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
select{width:auto;min-width:130px;cursor:pointer;}

/* ─── Tags / badges ───────────────────────────────────────────────── */
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;
  font-weight:500;border:1px solid var(--border2);color:var(--text-dim);
  white-space:nowrap;}
.tag-green{border-color:var(--green-dim);color:var(--green);background:rgba(63,185,80,.08);}
.tag-blue{border-color:var(--accent-dim);color:var(--accent);background:rgba(88,166,255,.08);}
.tag-yellow{border-color:var(--yellow);color:var(--yellow);background:rgba(210,153,34,.08);}
.tag-red{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08);}
.tag-purple{border-color:var(--purple);color:var(--purple);background:rgba(188,140,255,.08);}

/* ─── Flex helpers ────────────────────────────────────────────────── */
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.flex-between{display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:6px;}
.mt{margin-top:10px;} .mt-sm{margin-top:6px;} .mb{margin-bottom:10px;}
.gap-sm{gap:5px;}

/* ─── Empty state ─────────────────────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty .empty-icon{font-size:36px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:13px;margin-bottom:14px;}

/* ─── Accordion / details ─────────────────────────────────────────── */
details>summary{cursor:pointer;user-select:none;list-style:none;}
details>summary::-webkit-details-marker{display:none;}
.collapse-header{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-radius:var(--radius);background:var(--surface2);cursor:pointer;
  transition:background var(--transition);}
.collapse-header:hover{background:var(--surface3);}
.chevron{font-size:9px;color:var(--text-muted);transition:transform .2s;
  display:inline-block;}
details[open] .chevron{transform:rotate(90deg);}
.collapse-body{padding:10px 0 4px;}

/* ─── Sort bar ────────────────────────────────────────────────────── */
.sort-bar{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap;}
.sort-btn{background:var(--surface2);border:1px solid var(--border);
  color:var(--text-dim);padding:3px 10px;border-radius:20px;font-size:11px;
  cursor:pointer;transition:all var(--transition);}
.sort-btn.active{border-color:var(--accent);color:var(--accent);
  background:rgba(88,166,255,.08);}

/* ─── Phase bar ───────────────────────────────────────────────────── */
.phase-bar{display:flex;align-items:center;gap:0;margin:10px 0;overflow-x:auto;}
.phase-step{padding:7px 18px;font-size:11px;font-weight:600;cursor:pointer;
  transition:all var(--transition);white-space:nowrap;text-align:center;
  border:1px solid var(--border);margin-right:-1px;}
.phase-step:first-child{border-radius:var(--radius) 0 0 var(--radius);}
.phase-step:last-child{border-radius:0 var(--radius) var(--radius) 0;margin-right:0;}
.phase-step.done{background:var(--green-dim);color:#fff;border-color:var(--green-dim);}
.phase-step.current{background:var(--accent-dim);color:#fff;border-color:var(--accent);}
.phase-step.pending{background:var(--surface2);color:var(--text-dim);}

/* ─── Findings items ──────────────────────────────────────────────── */
.findings-item{font-size:12px;padding:3px 0 3px 10px;color:var(--text-dim);
  border-left:2px solid var(--border);margin-bottom:2px;}

/* ─── Loading / toast ─────────────────────────────────────────────── */
.loading-bar{height:2px;background:var(--accent-dim);border-radius:2px;
  animation:loadbar 1.2s ease-in-out infinite;width:60%;}
@keyframes loadbar{0%{width:0%;opacity:1}70%{width:80%;opacity:1}100%{width:100%;opacity:0}}
.loading-inline{display:inline-flex;align-items:center;gap:6px;
  color:var(--text-dim);font-size:12px;}
.spin{animation:spin .8s linear infinite;display:inline-block;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;right:20px;background:var(--surface3);
  border:1px solid var(--border2);color:var(--text);padding:10px 16px;
  border-radius:var(--radius-lg);font-size:12px;opacity:0;transition:opacity .3s;
  z-index:9999;max-width:320px;pointer-events:none;}
#toast.show{opacity:1;}
#toast.ok{border-color:var(--green-dim);color:var(--green);}
#toast.err{border-color:var(--red);color:var(--red);}

/* ─── Dash section headers ────────────────────────────────────────── */
.dash-section{font-size:10px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.7px;padding:4px 0 6px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;}

/* ─── Review list items ───────────────────────────────────────────── */
.review-item{background:var(--bg);border:1px solid var(--border);
  border-radius:var(--radius);margin:5px 0;overflow:hidden;
  transition:border-color var(--transition);}
.review-item:hover{border-color:var(--border2);}
.review-item.active-review{border-color:var(--accent);}
.review-item-header{display:flex;align-items:center;gap:8px;padding:8px 12px;
  cursor:pointer;transition:background var(--transition);}
.review-item-header:hover{background:var(--surface2);}
.review-item-body{padding:8px 12px 10px;border-top:1px solid var(--border);}

/* ─── Utility micro-classes ───────────────────────────────────────── */
.fs10{font-size:10px}.fs11{font-size:11px}.fs12{font-size:12px}
.c-dim{color:var(--text-dim)}.c-muted{color:var(--text-muted)}
.c-accent{color:var(--accent)}.fw6{font-weight:600}.fw7{font-weight:700}
.ml-auto{margin-left:auto}
</style>


<style>
/* ═══════════════════════════════════════════════════════════════════
   COMPARE MODULE STYLES  (scoped with .cmp- prefix)
   ═══════════════════════════════════════════════════════════════════ */

/* ── Overlay / modal shell ────────────────────────────────────────── */
.cmp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);
  z-index:2000;display:flex;align-items:flex-start;justify-content:center;
  padding:24px 16px;overflow-y:auto;opacity:0;transition:opacity .25s ease;
  pointer-events:none;}
.cmp-overlay.cmp-overlay-visible{opacity:1;pointer-events:all;}

.cmp-modal{background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-lg);width:100%;max-width:820px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  transform:translateY(-12px);transition:transform .25s ease;}
.cmp-overlay.cmp-overlay-visible .cmp-modal{transform:translateY(0);}

/* ── Modal header ─────────────────────────────────────────────────── */
.cmp-modal-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.cmp-modal-title{font-size:14px;font-weight:700;color:var(--text);flex:1;}
.cmp-close-btn{background:transparent;border:none;color:var(--text-dim);
  cursor:pointer;font-size:16px;padding:2px 6px;border-radius:var(--radius);
  transition:color var(--transition),background var(--transition);line-height:1;}
.cmp-close-btn:hover{color:var(--text);background:var(--surface3);}

/* ── Mode toggle ──────────────────────────────────────────────────── */
.cmp-mode-toggle{display:inline-flex;border:1px solid var(--border2);
  border-radius:20px;overflow:hidden;flex-shrink:0;}
.cmp-mode-btn{background:transparent;border:none;color:var(--text-muted);
  padding:4px 14px;font-size:11px;font-weight:600;cursor:pointer;
  transition:background var(--transition),color var(--transition);}
.cmp-mode-btn:hover:not(.cmp-mode-active){color:var(--text-dim);}
.cmp-mode-btn.cmp-mode-active{background:var(--surface3);color:var(--text);}

/* ── Modal body ───────────────────────────────────────────────────── */
.cmp-modal-body{padding:16px;display:flex;flex-direction:column;gap:12px;}

/* ── Selector row ─────────────────────────────────────────────────── */
.cmp-selectors-area{display:flex;flex-direction:column;gap:8px;}
.cmp-selector-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;
  align-items:start;}
@media(max-width:520px){.cmp-selector-row{grid-template-columns:1fr;}}
.cmp-selector-col{display:flex;flex-direction:column;gap:4px;}
.cmp-selector-divider{font-size:20px;color:var(--text-muted);padding-top:22px;
  text-align:center;font-weight:300;user-select:none;}
.cmp-sel-label{font-size:11px;font-weight:600;}
.cmp-label-a{color:var(--accent);}
.cmp-label-b{color:var(--green);}
.cmp-select{width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:6px 10px;border-radius:var(--radius);
  font-size:12px;cursor:pointer;transition:border-color var(--transition);}
.cmp-select:focus{outline:none;}
.cmp-select-a:focus{border-color:var(--accent);}
.cmp-select-b:focus{border-color:var(--green);}

/* ── Per-selector metadata preview chips ─────────────────────────── */
.cmp-sel-meta{display:flex;flex-wrap:wrap;gap:4px;min-height:20px;margin-top:2px;}
.cmp-meta-chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;
  font-weight:500;border:1px solid var(--border2);color:var(--text-dim);}
.cmp-chip-red{border-color:var(--red);color:var(--red);}
.cmp-chip-green{border-color:var(--green-dim);color:var(--green);}
.cmp-chip-yellow{border-color:var(--yellow);color:var(--yellow);}
.cmp-chip-purple{border-color:var(--purple);color:var(--purple);}

/* ── Action row ───────────────────────────────────────────────────── */
.cmp-actions{display:flex;align-items:center;gap:8px;}
.cmp-run-btn{display:inline-flex;align-items:center;gap:6px;
  background:var(--accent);color:#000;border:none;padding:7px 18px;
  border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:700;
  transition:opacity var(--transition);}
.cmp-run-btn:hover{opacity:.85;}
.cmp-run-btn:disabled{opacity:.45;cursor:not-allowed;}
.cmp-clear-btn{background:transparent;border:1px solid var(--border);
  color:var(--text-dim);padding:6px 12px;border-radius:var(--radius);
  cursor:pointer;font-size:11px;transition:all var(--transition);}
.cmp-clear-btn:hover{border-color:var(--border2);color:var(--text);}
</style>


<style>
/* ═══════════════════════════════════════════════════════════════════
   COMPARE RESULT STYLES
   ═══════════════════════════════════════════════════════════════════ */

/* ── Result area ──────────────────────────────────────────────────── */
.cmp-result-area{display:flex;flex-direction:column;gap:0;}

/* ── Summary bar ──────────────────────────────────────────────────── */
.cmp-summary-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  padding:10px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-lg);margin-bottom:10px;}
.cmp-summary-pair{display:flex;align-items:center;gap:6px;}
.cmp-ver-badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;}
.cmp-badge-a{background:rgba(88,166,255,.12);color:var(--accent);
  border:1px solid var(--accent-dim);}
.cmp-badge-b{background:rgba(63,185,80,.10);color:var(--green);
  border:1px solid var(--green-dim);}
.cmp-arrow{color:var(--text-muted);font-size:14px;font-weight:300;}
.cmp-summary-stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cmp-stat-added{font-size:12px;font-weight:700;color:var(--green);}
.cmp-stat-removed{font-size:12px;font-weight:700;color:var(--red);}
.cmp-ts-row{font-size:10px;color:var(--text-muted);display:flex;
  align-items:center;gap:4px;margin-left:auto;}
.cmp-ts-sep{color:var(--text-muted);}

/* ── Trend pill ───────────────────────────────────────────────────── */
.cmp-trend-pill{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;}
.cmp-trend-up  {background:rgba(248,81,73,.12); color:var(--red);}
.cmp-trend-down{background:rgba(63,185,80,.12); color:var(--green);}
.cmp-trend-same{background:rgba(139,148,158,.12);color:var(--text-dim);}

/* ── Section title ────────────────────────────────────────────────── */
.cmp-section-title{font-size:10px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.6px;margin:10px 0 5px;
  padding-bottom:4px;border-bottom:1px solid var(--border);}

/* ── Metadata diff grid ───────────────────────────────────────────── */
.cmp-meta-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.cmp-meta-row{display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap;}
.cmp-meta-field{font-weight:600;color:var(--text-muted);text-transform:capitalize;
  min-width:90px;}
.cmp-meta-before{color:var(--red);background:rgba(248,81,73,.06);
  padding:1px 7px;border-radius:4px;text-decoration:line-through;}
.cmp-meta-after{color:var(--green);background:rgba(63,185,80,.06);
  padding:1px 7px;border-radius:4px;}

/* ── Delta badge ──────────────────────────────────────────────────── */
.cmp-delta{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;}
.cmp-delta-up      {color:var(--red);  background:rgba(248,81,73,.10);}

<script>
// ── Utilities ────────────────────────────────────────────────────────────────
function escHtml(s){
  if(typeof s!=='string')s=String(s||'');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso){return iso?iso.slice(0,16).replace('T',' '):'–';}
function fmtDateShort(iso){return iso?iso.slice(0,10):'–';}
function relativeTime(iso){
  if(!iso)return'';
  const norm=(iso.endsWith('Z')||iso.includes('+'))?iso:iso+'Z';
  const diff=Date.now()-new Date(norm).getTime();
  if(isNaN(diff))return'';
  const m=Math.floor(diff/60000);
  if(m<1)return'just now';
  if(m<60)return`${m}m ago`;
  const h=Math.floor(m/60);
  if(h<24)return`${h}h ago`;
  return`${Math.floor(h/24)}d ago`;
}

let _toastTimer=null;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='show '+(type==='err'?'err':'ok');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.className='',3000);
}

async function api(method,path,body,{timeout=18000}={}){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),timeout);
    opts.signal=ctrl.signal;
    const r=await fetch(path,opts);
    clearTimeout(tid);
    return r.json();
  }catch(e){
    if(e.name==='AbortError')return{error:'Request timed out. Is the server running?'};
    return{error:e.message||'Cannot connect to server'};
  }
}
</script>

<script>
// ── State ────────────────────────────────────────────────────────────────────
// All navigation tabs — dashboard is fully implemented; others show placeholder or route to existing view
const TABS=[
  'dashboard','ingest','intelligence','versions','reviews',
  'diagrams','phases','pre-sales','proposals','admin','settings'
];

let state={
  projects:[],current:null,tab:'dashboard',
  backends:[],appName:'Contexta',
  _dashVersion:'',_dashReview:'',
  _versionSort:'newest',_reviewSort:'newest',
  _lastRenderedProject:null,
  // Extended state (Tasks #5)
  selectedReviewIds:[],   // review IDs checked for multi-review actions
};

// ── Derived helpers (read from inline state, mirrors spec shape) ─────────────
function getProjectId(){ return state.current?.id||null; }
function getVersionId(){ return state._dashVersion||null; }
function getReviewId(){  return state._dashReview||null; }

// ── Shared helpers ───────────────────────────────────────────────────────────
function formatVersionOption(v){
  const cnt=v.review_count||0;
  const ar=v.active_review;
  let aStr='';
  if(ar)aStr=`, active: ${ar.review_id}${ar.persona?' · '+ar.persona:''}`;
  const lbl=v.label?' – '+v.label:'';
  return`${v.version_id}${lbl} (${cnt} review${cnt===1?'':'s'}${aStr})`;
}

// ── Phase tag helper ─────────────────────────────────────────────────────────
// Maps phase_id → coloured inline tag HTML.
// Used in viewVersions() and viewReviews() to show phase context next to version.
const PHASE_TAG_STYLES={
  'pre-sales': 'background:rgba(155,142,209,.12);border:1px solid #9B8ED1;color:#6B5CA5',
  'design':    'background:rgba(108,140,255,.10);border:1px solid #6C8CFF;color:#4A6AE0',
  'delivery':  'background:rgba(76,175,130,.12);border:1px solid #4CAF82;color:#2E7D5C',
  'support':   'background:rgba(245,158,11,.12); border:1px solid #F59E0B;color:#92600A',
};
function phaseTag(phaseId){
  if(!phaseId)return'';
  const s=PHASE_TAG_STYLES[phaseId]||'background:var(--surface2);border:1px solid var(--border);color:var(--text-muted)';
  const lbl=phaseId.replace(/-/g,'\u2011');
  return`<span style="display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;${s};flex-shrink:0;white-space:nowrap">${escHtml(lbl)}</span>`;
}

// ── Activity strip builder ────────────────────────────────────────────────────
// Derives recent activity events from the hierarchy tree.
// Returns HTML for the horizontal activity strip (max 5 events, newest first).
const ACTIVITY_MAX=5;
const ACTIVITY_META={
  version_created:  {icon:'📋',label:'created'},
  review_created:   {icon:'🔍',label:'reviewed'},
  review_completed: {icon:'✅',label:'completed'},
};
function buildActivityEvents(hierarchy){
  const events=[];
  for(const phase of((hierarchy&&hierarchy.tree)||[])){
    const phaseId=phase.id||'';
    for(const ver of(phase.versions||[])){
      if(ver.created_at)events.push({type:'version_created',id:ver.version_id,
        label:ver.label?`${ver.version_id} – ${ver.label}`:ver.version_id,
        timestamp:ver.created_at,phase_id:phaseId});
      for(const rev of(ver.reviews||[])){
        if(rev.created_at)events.push({
          type:rev.quality_status==='complete'?'review_completed':'review_created',
          id:rev.review_id,
          label:`${rev.review_id}${rev.persona?' · '+rev.persona:''}`,
          timestamp:rev.created_at,phase_id:phaseId,version_id:ver.version_id});
      }
    }
  }
  events.sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));
  return events.slice(0,ACTIVITY_MAX);
}
function renderActivityStrip(hierarchy){
  const events=buildActivityEvents(hierarchy);
  if(!events.length)return'';
  const items=events.map(ev=>{
    const meta=ACTIVITY_META[ev.type]||{icon:'•',label:ev.type};
    const rel=relativeTime(ev.timestamp);
    return`<span style="display:inline-flex;align-items:center;gap:4px;flex-shrink:0">
      <span>${meta.icon}</span>
      <strong style="font-size:12px;color:var(--accent)">${escHtml(ev.id)}</strong>
      <span style="font-size:11px;color:var(--text-dim)">${meta.label}</span>
      ${rel?`<span style="font-size:10px;color:var(--text-muted)">${escHtml(rel)}</span>`:''}
    </span>`;
  }).join('<span style="color:var(--border2);font-size:14px;user-select:none">·</span>');
  return`<div style="display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-lg);padding:7px 16px;
    font-size:12px;overflow-x:auto;white-space:nowrap;margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);scrollbar-width:none">
    <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
      color:var(--text-muted);flex-shrink:0">Recent:</span>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap">${items}</div>
  </div>`;
}
</script>


<script>
// ── Tab labels (friendly display names) ─────────────────────────────────────
const TAB_LABELS={
  'dashboard':'Dashboard','ingest':'Ingest','intelligence':'Intelligence',
  'versions':'Versions','reviews':'Reviews','diagrams':'Diagrams',
  'phases':'Phases','pre-sales':'Pre-sales','proposals':'Proposals',

};

// ── Header ───────────────────────────────────────────────────────────────────
function renderHeader(){

          title="${canPropose?'Generate proposal from active review':'Select a review first to enable'}">
          📄 Generate Proposal
        </button>`
      :''}`;
  // Mount/refresh QuickSearch with current hierarchy versions
  _mountSearch();
}

// ── QuickSearch adapter ───────────────────────────────────────────────────────
// search.js expects AppState (the modular v2 store) but dashboard_v2.html uses
// its own inline state object. This adapter bridges the two by shimming a
// minimal AppState-compatible interface on window and feeding the current
// hierarchy versions into QuickSearch after every renderHeader() call.
(function _initSearchAdapter(){
  if(window._searchAdapterReady) return;
  window._searchAdapterReady = true;

  // Minimal AppState shim — QuickSearch only calls:
  //   AppState.get('versions')   → returns flat version list with nested reviews
  //   AppState.subscribe('versions', cb) → notified when versions change
  //   AppState.selectVersion(v)  → no-op here (dashboard_v2 manages its own state)
  //   AppState.selectReview(r)   → no-op
  const _subs = new Set();
  window.AppState = {
    get(key){
      if(key === 'versions') return window._qs_versions || [];
      return null;
    },
    subscribe(keys, fn){
      const ks = Array.isArray(keys) ? keys : [keys];
      if(ks.includes('versions')) _subs.add(fn);
      return () => _subs.delete(fn);
    },
    selectVersion(){ /* no-op */ },
    selectReview(){ /* no-op */ },
    /** Internal: called by _mountSearch() to push fresh data and notify subs. */
    _setVersions(versions){
      window._qs_versions = versions;
      _subs.forEach(fn => { try{ fn('versions', versions); }catch(e){} });
    }
  };
})();

// Called after every renderHeader() — feeds the current project's version+review
// tree into the QuickSearch index so navigation stays in sync with visible data.
async function _mountSearch(){
  // Mount the widget into the freshly-rendered #v2-search-wrap
  if(window.QuickSearch) QuickSearch.mount();

  if(!state.current) return;
  try{
    const h = await api('GET', `/api/projects/${state.current.id}/hierarchy`);
    const versions = [];
    for(const phase of (h.tree||[])){
      for(const v of (phase.versions||[])) versions.push(v);
    }
    // Push into shim — notifies QuickSearch subscriber to rebuild index
    if(window.AppState && window.AppState._setVersions) window.AppState._setVersions(versions);
  } catch(e){}
}

// ── QuickSearch navigation override for dashboard_v2.html ────────────────────
// search.js navigateTo() targets accordion DOM that exists in the modular v2
// layout, not in this SPA. Override it to use tab-switching + URL-fragment
// scroll so navigation still works meaningfully here.
QuickSearch && (QuickSearch._origNavigateTo = QuickSearch.navigateTo);
function _patchQuickSearchNav(){
  if(!window.QuickSearch) return;
  QuickSearch.navigateTo = function(type, id, versionId){
    if(type === 'version'){
      // Jump to Versions tab scoped to this version
      state._dashVersion = id;
      state._dashReview  = '';
      switchTab('versions');
    } else {
      // Jump to Reviews tab scoped to the parent version, highlight the review
      state._dashVersion = versionId;
      state._dashReview  = id;
      switchTab('reviews');
    }
  };
}
// Patch after DOM ready (search.js may not be loaded yet at parse time)
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', _patchQuickSearchNav);
} else {
  _patchQuickSearchNav();
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab){
  if(tab===state.tab&&state.current&&state._lastRenderedProject===state.current.id){
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  state.tab=tab;
  render();
}

// ── Placeholder for non-implemented tabs ─────────────────────────────────────
function viewPlaceholder(tabName){
  return`<div class="card" style="margin-top:20px">
    <div class="empty" style="padding:48px 24px">
      <div class="empty-icon" style="font-size:42px;margin-bottom:14px">🚧</div>
      <p style="font-size:14px;font-weight:600;margin-bottom:6px">${escHtml(TAB_LABELS[tabName]||tabName)}</p>
      <p style="font-size:12px;color:var(--text-dim)">This section is not yet available in v2.</p>
    </div>
  </div>`;
}

async function render(){
  renderHeader();
  if(state.current)state._lastRenderedProject=state.current.id;
  const main=document.getElementById('main');
  main.innerHTML=`<div style="padding:20px;text-align:center">
    <div class="loading-bar"></div>
    <p style="font-size:11px;color:var(--text-muted);margin-top:10px">Loading…</p>
  </div>`;

  // Tab → view function map; missing tabs get placeholder
  const views={
    dashboard:  viewDashboard,
    versions:   viewVersions,
    reviews:    viewReviews,
  };

  // Hard timeout: if view takes >20s, show a helpful message instead of spinning forever
  const _timeout=setTimeout(()=>{
    if(document.getElementById('main')?.querySelector('.loading-bar')){
      document.getElementById('main').innerHTML=`<div class="card" style="margin-top:20px">
        <div class="empty" style="padding:32px 20px">
          <div class="empty-icon">⚠️</div>
          <p style="font-size:13px;font-weight:600;margin-bottom:6px">Could not connect to server</p>
          <p style="font-size:12px;color:var(--text-dim);margin-bottom:14px">
            Make sure the Python server is running, then retry.
          </p>
          <button class="btn" onclick="render()">↻ Retry</button>
        </div>
      </div>`;
    }
  },20000);

  try{
    if(views[state.tab]){
      const html=await views[state.tab]();
      clearTimeout(_timeout);
      main.innerHTML=html;
    }else{
      clearTimeout(_timeout);
      main.innerHTML=viewPlaceholder(state.tab);
    }
  }catch(e){
    clearTimeout(_timeout);
    console.error('render error:',e);
    main.innerHTML=`<div class="card">
      <p style="color:var(--red);font-size:12px">⚠ Page failed to load: ${escHtml(e.message)}</p>
      <button class="btn btn-sm btn-ghost mt" onclick="render()">↻ Retry</button>
    </div>`;
  }
}

// ── Compare entry point ───────────────────────────────────────────────────────
function openCompare(){
  if(!state.current){toast('Select a project first','err');return;}
  const pid=state.current.id;
  console.log('[Compare] Opening for project:', pid,
    '| dashVersion:', state._dashVersion,

  Compare.open(pid);
}
</script>


<script>

        <button class="btn" onclick="createProject()">Create Project</button>
        <div id="createProjectError" class="mt"></div>
      </div>
    </div>
    ${list}</div>`;
}

// ── Dashboard view ────────────────────────────────────────────────────────────
async function viewDashboard(){
  if(!state.current)return viewNoProject();
  const pid=state.current.id;
  const selV=state._dashVersion||'';
  const selR=state._dashReview||'';

  let metricsUrl=`/api/projects/${pid}/hierarchy/metrics`;
  const ps=[];
  if(selV)ps.push(`version_id=${selV}`);
  if(selR)ps.push(`review_id=${selR}`);
  if(ps.length)metricsUrl+='?'+ps.join('&');

  let metrics={},versions=[],hierarchy={};
  try{[metrics,hierarchy]=await Promise.all([api('GET',metricsUrl),api('GET',`/api/projects/${pid}/hierarchy`)]);}catch(e){}
  try{const r=await api('GET',`/api/projects/${pid}/hierarchy/versions`);versions=r.versions||[];}catch(e){}

  // ── Smart Defaulting: auto-select latest version + review when nothing chosen
  if(!selV&&versions.length>0){
    // Sort newest first (API should already do this, but guard)
    const sorted=[...versions].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
    const latest=sorted[0];
    state._dashVersion=latest.version_id;
    const revs=latest.reviews||[];
    const active=revs.find(r=>r.review_id===latest.active_review_id)||revs[0]||null;
    if(active&&!selR)state._dashReview=active.review_id;
    // Re-build metrics URL with the defaulted selection
    if(state._dashVersion){
      metricsUrl=`/api/projects/${pid}/hierarchy/metrics?version_id=${state._dashVersion}`;
      if(state._dashReview)metricsUrl+=`&review_id=${state._dashReview}`;
      try{metrics=await api('GET',metricsUrl);}catch(e){}
    }
  }

  const avail=metrics.available_reviews||[];
  const ds=metrics.data_source||{};
  const risks=metrics.risks_identified||0;
  const constraints=metrics.constraints||0;
  const deps=metrics.dependencies||0;
  const assumptions=metrics.assumptions||0;
  const actions=metrics.action_items||0;
  const totalV=metrics.total_versions||versions.length;
  const totalR=metrics.total_reviews||0;
  const gaps=metrics.gaps_identified||0;
  const findings=metrics.total_findings||0;
  const artifacts=metrics.artifact_count||0;
  const trend=metrics.trend||[];

  // Use resolved defaults for dropdown selected state
  const curV=state._dashVersion||'';
  const curR=state._dashReview||'';

  const vOpts=versions.map(v=>`<option value="${v.version_id}"
    ${v.version_id===curV?'selected':''}>${escHtml(v.version_id)}
    ${escHtml(v.label||'')} (${fmtDateShort(v.created_at)})</option>`).join('');
  const rOpts=avail.map(r=>`<option value="${r.review_id}"
    ${r.review_id===curR?'selected':''}>${r.review_id}
    – ${escHtml(r.persona)} (${fmtDateShort(r.created_at)})</option>`).join('');

  // Activity strip (derived from hierarchy, no extra fetch)
  const activityHtml=renderActivityStrip(hierarchy);

  // Context selector
  const ctxCard=versions.length?`<div class="card" style="padding:12px 16px">
    <div class="flex-between mb">
      <div class="card-title" style="margin:0"><span class="icon">🎯</span>Data Context</div>
      <span class="tag tag-blue">${escHtml(ds.phase||'–')}</span>
    </div>
    <div class="flex" style="gap:10px">
      <div style="flex:1;min-width:150px">
        <label style="font-size:10px;color:var(--text-dim)">Version</label>
        <select style="width:100%;margin-top:2px"
          onchange="state._dashVersion=this.value;state._dashReview='';render()">
          <option value="">Latest</option>${vOpts}
        </select>
      </div>
      <div style="flex:1;min-width:160px">
        <label style="font-size:10px;color:var(--text-dim)">Review</label>
        <select style="width:100%;margin-top:2px"
          onchange="state._dashReview=this.value;render()">
          <option value="">Active Review</option>${rOpts}
        </select>
      </div>
    </div>
    ${ds.version?`<p style="font-size:11px;color:var(--accent);margin-top:6px">
      Showing: <strong>${escHtml(ds.version_label||ds.version)}</strong>
      → <strong>${ds.review_persona?escHtml(ds.review_persona)+' ('+ds.review+')':ds.review||'latest review'}</strong>
    </p>`:''}
  </div>`:'';

  // Overview stats
  const overviewCard=`<div class="card">
    <div class="dash-section">Project Overview</div>
    <div class="stat-grid mb">
      <div class="stat green"><div class="num">${totalV}</div><div class="lbl">Versions</div></div>
      <div class="stat green"><div class="num">${totalR}</div><div class="lbl">Reviews</div></div>
      ${artifacts?`<div class="stat"><div class="num">${artifacts}</div><div class="lbl">Artefacts</div></div>`:''}
    </div>
    <div class="flex gap-sm" style="flex-wrap:wrap">
      <button class="btn" onclick="switchTab('versions')">📋 Versions</button>
      <button class="btn btn-outline" onclick="switchTab('reviews')">🔍 Reviews</button>
      <button class="btn-compare" onclick="openCompare()" style="margin-left:auto">⇄ Compare</button>
      ${state._dashReview
        ?`<button class="btn-compare" onclick="openProposalPanel()" style="color:var(--green);border-color:var(--green-dim)">📄 Generate Proposal</button>`
        :''}
    </div>
  </div>`;

  // Version insight stats
  const insightCard=`<div class="card">
    <div class="dash-section">Version Insights (${ds.version?escHtml(ds.version_label||ds.version):'Latest'})</div>
    <div class="stat-grid mb">
      <div class="stat red"><div class="num">${risks}</div><div class="lbl">Risks</div></div>
      <div class="stat yellow"><div class="num">${constraints}</div><div class="lbl">Constraints</div></div>
      <div class="stat purple"><div class="num">${deps}</div><div class="lbl">Dependencies</div></div>
      <div class="stat"><div class="num">${assumptions}</div><div class="lbl">Assumptions</div></div>
      <div class="stat"><div class="num">${actions}</div><div class="lbl">Actions</div></div>
      ${gaps?`<div class="stat red"><div class="num">${gaps}</div><div class="lbl">Gaps</div></div>`:''}
      ${findings?`<div class="stat yellow"><div class="num">${findings}</div><div class="lbl">Findings</div></div>`:''}
    </div>
    ${trend.length>1?`
      <p style="font-size:10px;color:var(--text-muted);margin-bottom:4px">Risk trend · last ${trend.length} versions</p>
      <div style="display:flex;gap:8px;align-items:flex-end;min-height:48px">
        ${(()=>{const maxR=Math.max(...trend.map(t=>t.stats?.risks||0),1);
          return trend.map(t=>{const h=Math.max(6,Math.round((t.stats?.risks||0)/maxR*44));
            return`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;cursor:pointer"
              onclick="state._dashVersion='${t.version_id}';state._dashReview='';render()"
              title="${escHtml(t.version_id+' · '+fmtDateShort(t.created_at))}">
              <span style="font-size:9px;color:var(--text-dim)">${t.stats?.risks||0}</span>
              <div style="width:100%;height:${h}px;background:var(--red);border-radius:3px 3px 0 0;opacity:.7;transition:opacity .15s"
                onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.7"></div>
              <span style="font-size:9px;color:var(--text-muted)">${t.version_id}</span>
            </div>`;}).join('');})()}
      </div>`:''}
  </div>`;

  // ── Sprint 9: Health Signal, Pinned Insights, Memory Score ──────────────
  // Health badge (RAG) — populated by HealthSignal.update() via AppState subscription
  const healthBadgeSlot = `<div id="v2-health-badge" style="margin-bottom:10px"></div>`;

  // Pinned section — populated by PinnedInsights.updateSection() via subscription
  const pinnedSlot = `<div id="v2-pinned-section"></div>`;

  // Memory score card — populated by ProjectMemoryScore.update() via subscription
  const memoryScoreSlot = `<div id="v2-memory-score" style="margin-bottom:12px"></div>`;

  // Trigger immediate renders now that metrics are available
  // (auto-mount subscriptions fire on DOM ready, but the containers are new)
  if(window.HealthSignal)       HealthSignal.update(metrics);
  if(window.ProjectMemoryScore) ProjectMemoryScore.update(metrics);
  if(window.PinnedInsights && state.current) PinnedInsights.updateSection(state.current.id);

  return pinnedSlot+healthBadgeSlot+activityHtml+ctxCard+overviewCard+memoryScoreSlot+insightCard;
}
</script>


<script>
// ── Versions view ─────────────────────────────────────────────────────────────
async function viewVersions(){
  if(!state.current)return viewNoProject();
  const pid=state.current.id;

  let hierarchy={};
  try{hierarchy=await api('GET',`/api/projects/${pid}/hierarchy`);}catch(e){}
  const tree=hierarchy.tree||[];
  const totalV=hierarchy.total_versions||0;
  const totalR=hierarchy.total_reviews||0;

  if(!totalV)return`<div class="card"><div class="empty">
    <div class="empty-icon">📋</div>
    <p>No versions yet. Ingest artefacts then run Build Intelligence.</p>
  </div></div>`;

  // Collect all versions for the inline compare panel
  const allVersions=[];
  for(const phase of tree){
    for(const ver of(phase.versions||[])){
      allVersions.push(ver);
    }
  }
  allVersions.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));

  const sort=state._versionSort||'newest';
  const sortBar=`<div class="sort-bar">
    <span>Sort:</span>
    ${['newest','oldest','most-reviews'].map(s=>
      `<button class="sort-btn ${sort===s?'active':''}"
        onclick="state._versionSort='${s}';render()">${
          s==='newest'?'Newest First':s==='oldest'?'Oldest First':'Most Reviews'
        }</button>`).join('')}
  </div>`;

  // ── Inline compare panel (no backend, pure client)
  let inlineCompare='';
  if(allVersions.length>=2){
    const mkOpts=list=>list.map(v=>
      `<option value="${v.version_id}">${escHtml(formatVersionOption(v))}</option>`
    ).join('');
    const optsAsc=[...allVersions].reverse();
    inlineCompare=`<div class="card" style="border-top:2px solid var(--accent)">
      <div class="flex-between mb">
        <div class="card-title"><span class="icon">⇄</span>Compare Versions</div>
        <button class="btn-compare" onclick="openCompare()">Open Full Compare</button>
      </div>
      <p class="card-subtitle">Quick inline comparison — or use the Compare button for the full side-by-side diff panel.</p>
      <div class="flex mb" style="gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div style="flex:1;min-width:160px">
          <label style="font-size:10px;color:var(--text-dim)">Version A (before)</label>
          <select id="inlineCmpA" style="width:100%;margin-top:3px">${mkOpts(optsAsc)}</select>
        </div>
        <span style="color:var(--text-muted);font-weight:700;padding-bottom:6px">→</span>
        <div style="flex:1;min-width:160px">
          <label style="font-size:10px;color:var(--text-dim)">Version B (after)</label>
          <select id="inlineCmpB" style="width:100%;margin-top:3px">${mkOpts(allVersions)}</select>
        </div>
        <button class="btn" style="align-self:flex-end"
          onclick="runInlineVersionCompare()">Compare</button>
      </div>
      <div id="inlineCmpResult"></div>
    </div>`;
  }

  // ── Phase tree
  let treeHtml='';
  for(const phase of tree){
    let phaseVersions=[...(phase.versions||[])];
    if(!phaseVersions.length&&!phase.is_current)continue;

    if(sort==='oldest')phaseVersions.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
    else if(sort==='most-reviews')phaseVersions.sort((a,b)=>(b.reviews||[]).length-(a.reviews||[]).length);
    else phaseVersions.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));

    const isCurrent=phase.is_current;
    const phRevCnt=phaseVersions.reduce((s,v)=>s+(v.reviews||[]).length,0);

    treeHtml+=`<details ${isCurrent?'open':''} class="card"
      style="${isCurrent?'border-left:3px solid var(--accent)':''}">
      <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;
        gap:8px;margin:-16px -18px 0;padding:14px 18px;
        border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--surface)">
        <span class="chevron">▶</span>
        <strong style="font-size:13px;color:${isCurrent?'var(--accent)':'var(--text)'}">
          ${escHtml(phase.label)}</strong>
        ${isCurrent?'<span class="tag tag-green">current</span>':''}
        <span class="tag">${phaseVersions.length} ver</span>
        <span class="tag">${phRevCnt} rev</span>
      </summary>
      <div style="padding-top:12px">`;

    if(!phaseVersions.length){
      treeHtml+=`<p class="fs11 c-muted">No versions in this phase yet.</p>`;
    }else{
      for(const ver of phaseVersions){
        const verRevs=ver.reviews||[];
        const activeRid=ver.active_review_id||'';
        treeHtml+=`<details style="margin:4px 0;padding-left:8px;border-left:2px solid var(--border)">
          <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;
            gap:6px;padding:6px 8px;border-radius:var(--radius);transition:background .15s"
            onmouseover="this.style.background='var(--surface2)'"
            onmouseout="this.style.background=''">
            <span class="chevron">▶</span>
            <strong class="fs12">${escHtml(ver.version_id)}</strong>
            ${phaseTag(ver.phase_id||'')}
            ${ver.label?`<span class="c-dim fs11">– ${escHtml(ver.label)}</span>`:''}
            <span class="fs10 c-muted">${fmtDateShort(ver.created_at)}</span>
            <span class="tag ${verRevs.length?'tag-blue':''}">${verRevs.length} review${verRevs.length===1?'':'s'}</span>
            ${activeRid?'<span class="tag tag-green" style="font-size:9px">active set</span>':''}
            ${ver.stats?.risks?`<span class="tag tag-red" style="font-size:9px">${ver.stats.risks} risks</span>`:''}
          </summary>
          <div style="padding:6px 0 4px 14px">
            <div class="flex gap-sm mb" style="flex-wrap:wrap">
              <button class="btn btn-xs btn-ghost"
                onclick="state._dashVersion='${ver.version_id}';state._dashReview='';switchTab('dashboard')">
                View on Dashboard</button>
              <button class="btn-compare btn-xs" style="font-size:10px;padding:2px 8px"
                onclick="openCompare()">⇄ Compare</button>
              ${window.PinnedInsights&&state.current
                ?PinnedInsights.renderPinButton(ver.version_id,'version',
                    ver.version_id+(ver.label?' – '+ver.label:''),state.current.id)
                :''}
              <span class="fs10 c-dim">${ver.persona?escHtml(ver.persona)+' · ':''} ${escHtml(ver.ai_backend||'files_only')}</span>
            </div>`;

        for(const rev of verRevs){
          const rid=rev.review_id||'';if(!rid)continue;
          const isActive=rid===activeRid;
          treeHtml+=`<div class="review-item ${isActive?'active-review':''}">
            <div class="review-item-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
              <span class="chevron">▶</span>
              <span class="tag" style="font-size:10px;padding:1px 5px;font-weight:700;background:var(--surface3)">R${rev.iteration_number||'?'}</span>
              <strong class="fs11">${rid}</strong>
              ${isActive?'<span class="tag tag-green">active</span>':''}
              <span class="tag tag-purple">${escHtml(rev.persona||'–')}</span>
              ${rev.total_findings?`<span class="tag tag-yellow">${rev.total_findings} findings</span>`:''}
              <span style="font-size:10px;color:var(--text-muted);margin-left:auto">${relativeTime(rev.created_at)}</span>
            </div>
            <div class="review-item-body" style="display:none">
              ${rev.summary?`<p class="fs12 c-dim mb">${escHtml(rev.summary.slice(0,160))}</p>`:''}
              <div class="flex gap-sm">
                <button class="btn-compare btn-xs" style="font-size:10px;padding:3px 9px"
                  onclick="openCompare()">⇄ Compare Reviews</button>
              </div>
            </div>
          </div>`;
        }
        treeHtml+=`</div></details>`;
      }
    }
    treeHtml+=`</div></details>`;
  }

  const header=`<div class="card">
    <div class="flex-between mb">
      <div class="card-title"><span class="icon">📋</span>Project Versions</div>
      <span class="c-dim fs11">${totalV} versions · ${totalR} reviews</span>
    </div>
    ${sortBar}
  </div>`;

  return header+treeHtml+inlineCompare;
}
</script>


<script>
// ── Inline version compare (uses Compare module internals via public API) ──────
async function runInlineVersionCompare(){
  const va=document.getElementById('inlineCmpA')?.value;
  const vb=document.getElementById('inlineCmpB')?.value;
  const el=document.getElementById('inlineCmpResult');
  if(!va||!vb){el.innerHTML='<p style="color:var(--yellow);font-size:12px">Select both versions.</p>';return;}
  if(va===vb){el.innerHTML='<p style="color:var(--yellow);font-size:12px">Select two different versions.</p>';return;}
  el.innerHTML='<span class="loading-inline"><span class="spin">⟳</span> Comparing…</span>';
  const pid=state.current.id;
  const data=await api('POST',`/api/projects/${pid}/compare-versions`,{version_a:va,version_b:vb});
  if(data.error){el.innerHTML=`<p style="color:var(--red);font-size:12px">${escHtml(data.error)}</p>`;return;}

  const s=data.summary||{};
  const cats=data.categories||{};
  const CAT_ICONS={risks:'🔴',assumptions:'💭',dependencies:'🔗',constraints:'⛔',action_items:'✅'};
  const TREND_MAP={
    improving:'tag-green',risks_increasing:'tag-red',
    complexity_increasing:'tag-yellow',stable:''
  };
  const trendTag=`<span class="tag ${TREND_MAP[s.trend]||''}">${s.trend||'–'}</span>`;

  let html=`<div style="background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius-lg);overflow:hidden;margin-top:6px">
    <div style="padding:8px 12px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:600;color:var(--accent)">${escHtml(va)}</span>
      <span class="c-muted">→</span>
      <span style="font-size:11px;font-weight:600;color:var(--green)">${escHtml(vb)}</span>
      ${trendTag}
      <span style="margin-left:auto;font-size:11px;color:var(--text-dim)">
        <span style="color:var(--green)">+${s.total_added||0}</span> &nbsp;
        <span style="color:var(--red)">–${s.total_removed||0}</span>
      </span>
    </div>`;

  for(const[cat,d]of Object.entries(cats)){
    const net=d.net_change||0;
    const netCol=net>0?'var(--red)':net<0?'var(--green)':'var(--text-dim)';
    const added=d.added||[];
    const removed=d.removed||[];
    const hasChanges=added.length||removed.length;
    html+=`<details ${hasChanges?'open':''} style="border-bottom:1px solid var(--border)">
      <summary class="cmp-cat-header" style="list-style:none">
        <span class="cmp-cat-chevron">▶</span>
        <span>${CAT_ICONS[cat]||'📌'}</span>
        <strong style="font-size:12px;text-transform:capitalize">${cat.replace(/_/g,' ')}</strong>
        <span class="cmp-count-pill">${d.count_before} → ${d.count_after}</span>
        <span style="font-size:12px;font-weight:700;color:${netCol}">
          ${net>0?'+':''}${net}</span>
        ${!hasChanges?'<span class="cmp-no-change">no changes</span>':''}
      </summary>
      <div style="padding:6px 12px 10px">
        ${added.slice(0,5).map(i=>`<div class="cmp-item cmp-item-added">
          <span class="cmp-item-marker">+</span>
          <span>${escHtml(String(i).slice(0,120))}</span>
        </div>`).join('')}
        ${added.length>5?`<p class="cmp-overflow">… and ${added.length-5} more</p>`:''}
        ${removed.slice(0,5).map(i=>`<div class="cmp-item cmp-item-removed">
          <span class="cmp-item-marker">−</span>
          <span>${escHtml(String(i).slice(0,120))}</span>
        </div>`).join('')}
        ${removed.length>5?`<p class="cmp-overflow">… and ${removed.length-5} more</p>`:''}
        ${!hasChanges?`<p class="cmp-unchanged-note">${d.unchanged_count||d.count_before} items — no changes</p>`:''}
      </div>
    </details>`;
  }
  html+=`<div style="padding:6px 12px;font-size:11px;color:var(--text-dim)">
    ${fmtDate(data.timestamp_a)} → ${fmtDate(data.timestamp_b)}
  </div></div>`;
  el.innerHTML=html;
}
</script>


<script>
// ── Reviews view (v1 feature parity + v2 UX) ─────────────────────────────────
async function viewReviews(){
  if(!state.current)return viewNoProject();
  const pid=state.current.id;

  let hierarchy={};
  try{hierarchy=await api('GET',`/api/projects/${pid}/hierarchy`);}catch(e){}
  if(hierarchy.error){
    return`<div class="card"><div class="empty">
      <div class="empty-icon">⚠️</div>
      <p style="color:var(--red)">${escHtml(hierarchy.error)}</p>
      <button class="btn mt" onclick="render()">↻ Retry</button>
    </div></div>`;
  }
  const tree=hierarchy.tree||[];

  let versionsWithReviews=[];
  for(const phase of tree){
    for(const ver of(phase.versions||[])){
      if((ver.reviews||[]).length>0)versionsWithReviews.push({...ver,phase_label:phase.label});
    }
  }
  if(state._dashVersion){
    versionsWithReviews=versionsWithReviews.filter(v=>v.version_id===state._dashVersion);
  }

  const sort=state._reviewSort||'newest';
  const sortBar=`<div class="sort-bar">
    <span>Sort:</span>
    ${['newest','oldest','most-findings'].map(s=>
      `<button class="sort-btn ${sort===s?'active':''}"
        onclick="state._reviewSort='${s}';render()">${
          s==='newest'?'Newest First':s==='oldest'?'Oldest First':'Most Findings'
        }</button>`).join('')}
    <button class="btn-compare" style="margin-left:auto" onclick="openCompare()">⇄ Compare</button>
  </div>`;

  if(!versionsWithReviews.length){
    return`<div class="card">
      <div class="flex-between mb">
        <div class="card-title"><span class="icon">🔍</span>Review History</div>
      </div>
      ${sortBar}
      <div class="empty" style="padding:24px 0">
        <div class="empty-icon">🔍</div>
        <p>No reviews yet. Ingest artefacts and run Build Intelligence first.</p>
      </div>
    </div>`;
  }

  let listHtml=`<div class="card">
    <div class="flex-between mb">
      <div class="card-title"><span class="icon">🔍</span>Review History
        ${state._dashVersion?`<span class="tag tag-blue" style="font-size:10px">v: ${escHtml(state._dashVersion)}</span>`:''}
      </div>
      ${state._dashVersion?`<button class="btn btn-sm btn-ghost" onclick="state._dashVersion='';render()">✕ All versions</button>`:''}
    </div>
    ${sortBar}`;

  for(const ver of versionsWithReviews){
    let revs=[...(ver.reviews||[])];
    if(sort==='oldest')revs.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
    else if(sort==='most-findings')revs.sort((a,b)=>(b.total_findings||0)-(a.total_findings||0));
    else revs.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
    const activeId=ver.active_review_id||'';

    listHtml+=`<details open style="border-left:2px solid var(--border);padding-left:10px;margin:8px 0">
      <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
        padding:5px 6px;border-radius:var(--radius)"
        onmouseover="this.style.background='var(--surface2)'"
        onmouseout="this.style.background=''">
        <span class="chevron">▶</span>
        <strong class="fs12">${escHtml(ver.version_id)}</strong>
        ${ver.label?`<span class="c-dim fs12">– ${escHtml(ver.label)}</span>`:''}
        <span class="tag">${escHtml(ver.phase_label||'')}</span>
        <span class="tag tag-blue">${revs.length} reviews</span>
      </summary>`;

    for(const rev of revs){
      const rid=rev.review_id||''; if(!rid)continue;
      const isActive=rid===activeId;
      const qs=rev.quality_status||'pending';
      const qCls=qs==='complete'?'tag-green':qs==='interim'?'tag-yellow':'';
      const qLabel=qs==='complete'?'Final':qs==='interim'?'In Progress':'Draft';
      // Status action buttons — v1 parity
      let sBtns='';
      if(qs==='pending'){
        sBtns=`<button class="btn btn-sm btn-ghost" title="Work in progress"
          onclick="openMarkCompleteV2('${escHtml(rid)}','interim')">Mark Draft</button>
          <button class="btn btn-sm btn-ghost" title="Ready for proposal"
          onclick="openMarkCompleteV2('${escHtml(rid)}','complete')">Mark Final</button>`;
      } else if(qs==='interim'){
        sBtns=`<button class="btn btn-sm btn-ghost"
          onclick="openMarkCompleteV2('${escHtml(rid)}','complete')">Mark Final</button>`;
      } else {
        sBtns=`<span style="font-size:10px;color:var(--green)">✓ Final</span>`;
      }

      listHtml+=`<details style="margin:4px 0;background:var(--bg);
        border:1px solid ${isActive?'var(--accent)':'var(--border)'};
        border-radius:var(--radius);overflow:hidden">
        <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;
          gap:7px;padding:7px 10px"
          onmouseover="this.style.background='var(--surface2)'"
          onmouseout="this.style.background=''">
          <span class="chevron">▶</span>
          <span class="tag" style="font-size:10px;padding:1px 6px;font-weight:700;
            background:var(--surface3)">R${rev.iteration_number||'?'}</span>
          <strong class="fs11">${escHtml(rid)}</strong>
          ${isActive?'<span class="tag tag-green">active</span>':''}
          <span class="tag tag-purple">${escHtml(rev.persona||'–')}</span>
          <span class="tag ${qCls}" style="font-size:9px">${qLabel}</span>
          ${rev.total_findings?`<span class="tag tag-yellow">${rev.total_findings} findings</span>`:''}
          <span style="font-size:10px;color:var(--text-muted);margin-left:auto">
            ${relativeTime(rev.created_at)}</span>
        </summary>
        <div style="padding:8px 10px 10px;border-top:1px solid var(--border)">
          ${rev.summary?`<p class="fs12 c-dim" style="margin-bottom:8px">${escHtml(rev.summary.slice(0,200))}</p>`:''}
          <div class="flex gap-sm" style="flex-wrap:wrap;margin-bottom:6px">
            <button class="btn btn-sm btn-outline"
              onclick="openReviewDetail('${escHtml(rid)}','${escHtml(ver.version_id)}')">
              🔍 Full Details</button>
            ${!isActive?`<button class="btn btn-sm btn-ghost"
              onclick="setActiveReviewV2('${escHtml(ver.version_id)}','${escHtml(rid)}')">
              Set Active</button>`:''}
            ${sBtns}
            <button class="btn btn-sm btn-ghost" onclick="openCompare()">⇄ Compare</button>
            <button class="btn btn-sm btn-ghost"
              onclick="state._dashVersion='${escHtml(ver.version_id)}';state._dashReview='${escHtml(rid)}';openProposalPanel()"
              style="color:var(--green);border-color:var(--green-dim)">📄 Proposal</button>
            <button class="btn btn-sm" style="background:var(--red);color:#fff"
              onclick="deleteReviewV2('${escHtml(rid)}')">Delete</button>
          </div>
          <div id="mcForm_${escHtml(rid)}" style="display:none;padding:8px 10px;
            background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)">
            <p class="fs11 c-dim" style="margin-bottom:5px">Your name (required to record change)</p>
            <div class="flex gap-sm">
              <input id="mcName_${escHtml(rid)}" placeholder="Your name" style="flex:1;min-width:100px">
              <button class="btn btn-sm btn-ghost"
                onclick="submitMarkCompleteV2('${escHtml(rid)}','interim')">Save Draft</button>
              <button class="btn btn-sm" style="background:var(--green-dim);color:#fff"
                onclick="submitMarkCompleteV2('${escHtml(rid)}','complete')">Mark Final</button>
              <button class="btn btn-xs btn-ghost"
                onclick="document.getElementById('mcForm_${escHtml(rid)}').style.display='none'">✕</button>
            </div>
          </div>
        </div>
      </details>`;
    }
    listHtml+=`</details>`;
  }
  listHtml+=`</div>`;
  return listHtml;
}
</script>

<script>
// ── Review status helpers (v2, no reload) ────────────────────────────────────
function openMarkCompleteV2(rid, suggestedStatus){
  const el=document.getElementById('mcForm_'+rid);
  if(el){ el.style.display=''; el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}
async function submitMarkCompleteV2(rid, qualityStatus){
  const name=(document.getElementById('mcName_'+rid)?.value||'').trim();
  if(!name){ toast('Enter your name first','err'); return; }
  const pid=state.current?.id; if(!pid) return;
  const r=await api('POST',`/api/projects/${pid}/hierarchy/reviews/${rid}/complete`,
    {completed_by:name, quality_status:qualityStatus});
  if(r.error){ toast(r.error,'err'); return; }
  toast(`Review marked as ${qualityStatus==='complete'?'Final':'Draft'}`);
  render();
}
async function setActiveReviewV2(versionId, reviewId){
  const pid=state.current?.id; if(!pid) return;
  const r=await api('POST',`/api/projects/${pid}/hierarchy/versions/${versionId}/set-active-review`,
    {review_id:reviewId});
  if(r.error){ toast(r.error,'err'); return; }
  toast('Active review updated'); render();
}
async function deleteReviewV2(rid){
  if(!confirm('Delete this review? This cannot be undone.')) return;
  const pid=state.current?.id; if(!pid) return;
  const r=await api('POST',`/api/projects/${pid}/hierarchy/reviews/${rid}/delete`);
  if(r.error){ toast(r.error,'err'); return; }
  toast('Review deleted'); render();
}
</script>

<script>
// ── Review Full Detail — right-side drawer (v2 UX, no page reload) ────────────
async function openReviewDetail(rid, versionId){
  if(!rid||!state.current) return;
  const pid=state.current.id;
  _openReviewDrawerShell(rid);
  const r=await api('GET',`/api/projects/${pid}/hierarchy/reviews/${rid}`);
  const body=document.getElementById('rd-body');
  if(!body) return;
  if(r.error){
    body.innerHTML=`<div style="padding:20px;color:var(--red)">⚠ ${escHtml(r.error)}</div>`;
    return;
  }
  _renderReviewDrawerContent(r, versionId||r.version_id||'');
}

function _openReviewDrawerShell(rid){
  const existing=document.getElementById('rd-overlay');
  if(existing) existing.remove();
  const ov=document.createElement('div');
  ov.id='rd-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1800;'+
    'opacity:0;transition:opacity .25s ease;pointer-events:none;';
  ov.innerHTML=`<div id="rd-drawer" style="position:fixed;top:0;right:0;height:100%;width:560px;
    max-width:96vw;background:var(--surface);border-left:1px solid var(--border2);z-index:1801;
    display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .28s ease;box-shadow:-4px 0 24px rgba(0,0,0,.5);">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;
      border-bottom:1px solid var(--border);background:var(--surface2);flex-shrink:0;">
      <span style="font-size:14px;font-weight:700;flex:1">🔍 Review Detail</span>
      <button onclick="closeReviewDrawer()" style="background:transparent;border:none;
        color:var(--text-dim);font-size:17px;cursor:pointer;padding:2px 7px;
        border-radius:var(--radius);line-height:1">✕</button>
    </div>
    <div id="rd-body" style="flex:1;overflow-y:auto;padding:16px;">
      <div style="display:flex;align-items:center;gap:8px;padding:20px 0;color:var(--text-dim)">
        <span class="spin">⟳</span> Loading…
      </div>
    </div>
  </div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeReviewDrawer(); });
  ov._kh=e=>{ if(e.key==='Escape') closeReviewDrawer(); };
  document.addEventListener('keydown',ov._kh);
  document.body.appendChild(ov);
  requestAnimationFrame(()=>{
    ov.style.opacity='1'; ov.style.pointerEvents='all';
    document.getElementById('rd-drawer').style.transform='translateX(0)';
  });
}

function closeReviewDrawer(){
  const ov=document.getElementById('rd-overlay');
  if(!ov) return;
  if(ov._kh) document.removeEventListener('keydown',ov._kh);
  ov.style.opacity='0';
  const dr=document.getElementById('rd-drawer');
  if(dr) dr.style.transform='translateX(100%)';
  setTimeout(()=>{ if(ov.parentNode) ov.remove(); },300);
}

function _renderReviewDrawerContent(r, versionId){
  const body=document.getElementById('rd-body');
  if(!body) return;
  const pid=state.current?.id||'';
  const rid=r.review_id||'';
  const qs=r.quality_status||'pending';
  const qLabel=qs==='complete'?'Final':qs==='interim'?'In Progress':'Draft';
  const qCls=qs==='complete'?'tag-green':qs==='interim'?'tag-yellow':'';
  const score=r.completeness_score||0;
  const scoreCol=score>=70?'var(--green)':score>=40?'var(--yellow)':'var(--red)';
  const findings=r.findings||{};
  const FICONS={risks:'🔴',assumptions:'💭',dependencies:'🔗',constraints:'⛔',
    action_items:'✅',gaps:'🔍',recommendations:'💡',questions:'❓'};

  let sBtns='';
  if(qs==='pending'){
    sBtns=`<button class="btn btn-sm btn-ghost" onclick="_rdMark('${escHtml(rid)}','interim')">Mark Draft</button>
           <button class="btn btn-sm btn-ghost" onclick="_rdMark('${escHtml(rid)}','complete')">Mark Final</button>`;
  } else if(qs==='interim'){
    sBtns=`<button class="btn btn-sm btn-ghost" onclick="_rdMark('${escHtml(rid)}','complete')">Mark Final</button>`;
  } else {
    sBtns=`<span style="font-size:10px;color:var(--green)">✓ Final</span>`;
  }

  let html=`<div style="background:var(--surface2);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px">
    <div class="flex" style="flex-wrap:wrap;gap:6px;margin-bottom:6px">
      <span class="tag tag-blue">v: ${escHtml(r.version_id||versionId||'–')}</span>
      <span class="tag tag-purple">${escHtml(r.persona||'–')}</span>
      <span class="tag ${qCls}">${qLabel}</span>
      ${r.iteration_number?`<span class="tag" style="font-weight:700">R${r.iteration_number}</span>`:''}
      <span style="font-size:10px;color:${scoreCol};background:var(--surface3);
        padding:1px 6px;border-radius:10px">${score}% complete</span>
      <span style="font-size:10px;color:var(--text-muted);margin-left:auto">${fmtDate(r.created_at)}</span>
    </div>
    ${r.summary?`<p style="font-size:12px;color:var(--text-dim);line-height:1.6">${escHtml(r.summary)}</p>`:''}
  </div>
  <div class="flex gap-sm" style="flex-wrap:wrap;margin-bottom:10px">
    ${sBtns}
    <button class="btn btn-sm btn-ghost" onclick="openCompare()">⇄ Compare</button>
    <button class="btn btn-sm btn-ghost"
      onclick="state._dashVersion='${escHtml(r.version_id||versionId||'')}';state._dashReview='${escHtml(rid)}';closeReviewDrawer();openProposalPanel()"
      style="color:var(--green);border-color:var(--green-dim)">📄 Proposal</button>
  </div>
  <div id="rd-mc" style="display:none;margin-bottom:10px;padding:8px 10px;
    background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)">
    <p class="fs11 c-dim" style="margin-bottom:5px">Your name</p>
    <div class="flex gap-sm">
      <input id="rd-mc-name" placeholder="Your name" style="flex:1">
      <button class="btn btn-sm btn-ghost" id="rd-btn-d"
        onclick="_rdSubmit('${escHtml(rid)}','interim')">Save Draft</button>
      <button class="btn btn-sm" id="rd-btn-f" style="background:var(--green-dim);color:#fff"
        onclick="_rdSubmit('${escHtml(rid)}','complete')">Mark Final</button>
      <button class="btn btn-xs btn-ghost"
        onclick="document.getElementById('rd-mc').style.display='none'">✕</button>
    </div>
  </div>`;

  // Files included
  if(r.included_files?.length){
    html+=`<div style="margin-bottom:10px">
      <p style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;
        letter-spacing:.5px;margin-bottom:5px">Files Reviewed (${r.included_files.length})</p>
      <div class="flex" style="flex-wrap:wrap;gap:4px">
        ${r.included_files.map(f=>`<span class="tag tag-green" style="font-size:10px">${escHtml(f)}</span>`).join('')}
      </div></div>`;
  }

  // Findings sections
  const fKeys=Object.keys(findings).filter(k=>Array.isArray(findings[k])&&findings[k].length);
  if(fKeys.length){
    html+=`<p style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:6px">Findings</p>`;
    for(const sec of fKeys){
      const items=findings[sec];
      html+=`<details open style="border:1px solid var(--border);border-radius:var(--radius);
        margin-bottom:5px;overflow:hidden">
        <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
          padding:7px 10px;background:var(--surface2)"
          onmouseover="this.style.background='var(--surface3)'"
          onmouseout="this.style.background='var(--surface2)'">
          <span class="chevron">▶</span><span>${FICONS[sec]||'📌'}</span>
          <strong style="font-size:11px;text-transform:capitalize">${escHtml(sec.replace(/_/g,' '))}</strong>
          <span class="tag" style="margin-left:4px">${items.length}</span>
        </summary>
        <div style="padding:6px 10px 8px">
          ${items.map(it=>`<div style="font-size:12px;padding:3px 0 3px 8px;color:var(--text-dim);
            border-left:2px solid var(--border);margin-bottom:2px">${escHtml(String(it))}</div>`).join('')}
        </div></details>`;
    }
  } else {
    html+=`<p style="font-size:12px;color:var(--text-muted);font-style:italic">No findings recorded yet.</p>`;
  }

  if(r.questions?.length){
    html+=`<details style="border:1px solid var(--border);border-radius:var(--radius);
      margin-top:6px;overflow:hidden">
      <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
        padding:7px 10px;background:var(--surface2)">
        <span class="chevron">▶</span>
        <strong style="font-size:11px">❓ Open Questions</strong>
        <span class="tag" style="margin-left:4px">${r.questions.length}</span>
      </summary>
      <div style="padding:6px 10px 8px">
        ${r.questions.map(q=>`<div style="font-size:12px;padding:3px 0 3px 8px;color:var(--text-dim);
          border-left:2px solid var(--yellow);margin-bottom:2px">${escHtml(q)}</div>`).join('')}
      </div></details>`;
  }
  body.innerHTML=html;
}

function _rdMark(rid, targetStatus){
  const form=document.getElementById('rd-mc');
  if(!form) return;
  const bd=document.getElementById('rd-btn-d');
  const bf=document.getElementById('rd-btn-f');
  if(bd) bd.style.display=targetStatus==='interim'?'':'none';
  if(bf) bf.style.display=targetStatus==='complete'?'':'none';
  form.style.display='';
  document.getElementById('rd-mc-name')?.focus();
}
async function _rdSubmit(rid, qualityStatus){
  const name=(document.getElementById('rd-mc-name')?.value||'').trim();
  if(!name){ toast('Enter your name first','err'); return; }
  const pid=state.current?.id; if(!pid) return;
  const r=await api('POST',`/api/projects/${pid}/hierarchy/reviews/${rid}/complete`,
    {completed_by:name, quality_status:qualityStatus});
  if(r.error){ toast(r.error,'err'); return; }
  toast(`Review marked as ${qualityStatus==='complete'?'Final':'Draft'}`);
  closeReviewDrawer(); render();
}
</script>


<script>
// ── Project actions ───────────────────────────────────────────────────────────
async function selectProject(id){
  state.current=state.projects.find(x=>x.id===id)||state.current;
  try{localStorage.setItem('pdae_current_project_id',state.current.id);}catch(e){}
  state._dashVersion='';state._dashReview='';state.selectedReviewIds=[];
  state.tab='dashboard';render();
}

async function createProject(){
  const name=(document.getElementById('newName')?.value||'').trim();
  if(!name)return;
  const r=await api('POST','/api/projects',{name});
  if(r.project){
    await loadProjects();
    state.current=state.projects.find(p=>p.id===r.project.id)||r.project;
    state.tab='dashboard';toast(`Project "${name}" created`);render();
  }else{
    const el=document.getElementById('createProjectError');
    if(el)el.innerHTML=`<p style="color:var(--red);font-size:12px;margin-top:6px">${escHtml(r.error||'Failed')}</p>`;
    else toast(r.error||'Failed','err');
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function loadProjects(){
  const r=await api('GET','/api/projects');
  state.projects=r.projects||[];
  if(!state.current&&state.projects.length){
    let restoredId=null;
    try{restoredId=localStorage.getItem('pdae_current_project_id');}catch(e){}
    const found=restoredId&&state.projects.find(x=>x.id===restoredId);
    state.current=found||state.projects[0];
  }
}

async function loadBackends(){
  const r=await api('GET','/api/backends');
  state.backends=r.backends||[];
}

async function loadAppInfo(){
  try{
    const h=await api('GET','/api/health');
    if(h.app){state.appName=h.app;document.title=`${h.app} v2`;}
  }catch(e){}
}

(async()=>{
  await Promise.all([loadProjects(),loadBackends(),loadAppInfo()]);
  render();
})();
</script>
