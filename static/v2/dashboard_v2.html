// ═══════════════════════════════════════════════════════════════════

// ── Proposal panel state ──────────────────────────────────────
const _pp = {
  open: false,
  loading: false,
  error: null,
  doc: null,       // last generated ProposalDocument
  tracker: null,   // proposal tracker (contains current_version)
};

// ── Open the panel ────────────────────────────────────────────
function openProposalPanel(){
  const pid = getProjectId();
  if(!pid){ toast('Select a project first','err'); return; }
  const rid = getReviewId();
  if(!rid){ toast('Select a review first to generate a proposal','err'); return; }

  console.log('[Proposal] Opening panel | project:', pid,
    '| version:', getVersionId(), '| review:', rid,
    '| supplemental:', state.selectedReviewIds);

  _pp.open = true;
  _pp.error = null;
  _pp.doc = null;
  _buildProposalDrawer();
}

// ── Close the panel ───────────────────────────────────────────
function closeProposalPanel(){
  _pp.open = false;
  const overlay = document.getElementById('pp-overlay');
  if(overlay){
    overlay.classList.remove('pp-open');
    setTimeout(()=>{ if(overlay.parentNode) overlay.remove(); }, 300);
  }
}

// ── Build / inject drawer DOM ─────────────────────────────────
function _buildProposalDrawer(){
  const existing = document.getElementById('pp-overlay');
  if(existing) existing.remove();

  const pid = getProjectId();
  const vid = getVersionId();
  const rid = getReviewId();
  const suppIds = (state.selectedReviewIds||[]).filter(id=>id!==rid);

  const overlay = document.createElement('div');
  overlay.id = 'pp-overlay';
  overlay.className = 'pp-overlay';
  overlay.innerHTML = `
    <div class="pp-drawer" id="pp-drawer" role="dialog" aria-modal="true" aria-labelledby="pp-title">
      <div class="pp-header">
        <div>
          <div class="pp-title" id="pp-title">📄 Generate Proposal</div>
          <div class="pp-subtitle">In-context proposal from active review</div>
        </div>
        <button class="pp-close" onclick="closeProposalPanel()" aria-label="Close proposal panel">✕</button>
      </div>

      <div class="pp-ctx" id="pp-ctx-bar">
        ${vid?`<span class="pp-ctx-chip pp-ctx-ver">📋 ${escHtml(vid)}</span>`:''}
        ${rid?`<span class="pp-ctx-chip pp-ctx-rev">🔍 ${escHtml(rid)}</span>`:''}
        ${suppIds.length?`<span class="pp-ctx-chip pp-ctx-supp">+${suppIds.length} supplemental</span>`:''}
        ${!vid&&!rid?'<span style="font-size:11px;color:var(--text-muted)">No context selected</span>':''}
      </div>

      <div class="pp-action-bar">
        <button class="pp-generate-btn" id="pp-gen-btn"
          onclick="_runGenerateProposal()"
          ${rid?'':'disabled'}>
          ⚡ Generate
        </button>
        <label class="pp-force-label">
          <input type="checkbox" id="pp-force-chk" style="width:auto;margin:0">
          Force regenerate
        </label>
        <span style="font-size:11px;color:var(--text-muted);margin-left:auto" id="pp-status"></span>
      </div>

      <div id="pp-error-bar"></div>

      <div class="pp-body" id="pp-body">
        <div class="pp-empty">
          <div class="pp-empty-icon">📝</div>
          <p style="font-size:12px">Click <strong>Generate</strong> to create a proposal document from the active review.</p>
        </div>
      </div>
    </div>`;

  // Close on backdrop click
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeProposalPanel(); });

  // Close on Escape
  overlay._keyHandler = e=>{ if(e.key==='Escape') closeProposalPanel(); };
  document.addEventListener('keydown', overlay._keyHandler);

  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('pp-open'));
}

// ── Run proposal generation ───────────────────────────────────
async function _runGenerateProposal(){
  const pid = getProjectId();
  const vid = getVersionId();
  const rid = getReviewId();

  if(!pid||!rid){
    _ppSetError('A project and review must be selected to generate a proposal.');
    return;
  }

  const suppIds = (state.selectedReviewIds||[]).filter(id=>id!==rid);
  const force   = document.getElementById('pp-force-chk')?.checked||false;

  console.log('[Proposal] pid:', pid, '| vid:', vid, '| rid:', rid,
    '| supp:', suppIds, '| force:', force);

  _ppSetLoading(true);
  _ppSetError(null);

  try{
    // Step 1: get or create proposal tracker
    let tracker = await api('GET', `/api/projects/${pid}/proposal`);
    if(tracker.error){
      tracker = await api('POST', `/api/projects/${pid}/proposal`,{
        proposal_name: `Proposal – ${pid}`,
        hierarchy_version_id: vid||'',
        review_id: rid,
      });
    }
    if(tracker.error){ _ppSetError(`Could not create proposal tracker: ${tracker.error}`); _ppSetLoading(false); return; }
    _pp.tracker = tracker;

    // proposal_ver_id may be nested differently across versions
    const proposalVerId = tracker.current_version
      || tracker.proposal_ver_id
      || (tracker.versions&&tracker.versions[0]?.version_id)
      || '';

    console.log('[Proposal] tracker ok | proposal_ver_id:', proposalVerId);

    // Step 2: generate document
    const payload = {
      proposal_ver_id: proposalVerId,
      hierarchy_version_id: vid||'',
      review_id: rid,
      ai_backend: 'files_only',
      force: force,
    };
    if(suppIds.length) payload.supplemental_review_ids = suppIds;

    const result = await api('POST', `/api/projects/${pid}/proposal/generate`, payload);

    if(result.error){
      // ── Quality gate failure → guided UX (not raw error) ──────
      _ppSetLoading(false);
      _ppShowQualityGateUX(rid, pid, vid, result.error);
      return;
    }

    _pp.doc = result.document || result;
    _ppSetLoading(false);
    _renderProposalDoc(_pp.doc);

  }catch(err){
    console.error('[Proposal] Exception:', err);
    _ppSetError(`Unexpected error: ${escHtml(err.message)}`);
    _ppSetLoading(false);
  }
}

// ── Quality gate guided UX ────────────────────────────────────
function _ppShowQualityGateUX(rid, pid, vid, rawError){
  const body = document.getElementById('pp-body');
  if(!body) return;

  // Parse what's missing from the error message (backend lists missing cats)
  const missingMatch = rawError.match(/missing[^:]*:\s*([^.]+)/i)
    || rawError.match(/blockers[^:]*:\s*([^.]+)/i);
  const missingText = missingMatch ? missingMatch[1] : '';
  const missingItems = missingText
    ? missingText.split(/[,;]+/).map(s=>s.trim()).filter(Boolean)
    : [];

  // Detect "not complete / not passed" wording
  const isGateFail = /incomplete|not passed|quality gate|pending|blockers/i.test(rawError);

  if(!isGateFail){
    // Not a gate error — show it plainly
    _ppSetError(rawError);
    return;
  }

  body.innerHTML=`
    <div style="border:1px solid var(--yellow);border-radius:var(--radius-lg);padding:16px;
      background:rgba(210,153,34,.06);margin-bottom:12px">
      <p style="font-size:13px;font-weight:700;color:var(--yellow);margin-bottom:6px">
        ⚠ Review is incomplete
      </p>
      <p style="font-size:12px;color:var(--text-dim);margin-bottom:10px">
        This review has not passed the quality gate. Before generating a proposal, you can:
      </p>
      ${missingItems.length?`
      <div style="margin-bottom:12px">
        <p style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:5px">Missing areas:</p>
        <ul style="list-style:none;padding:0">
          ${missingItems.map(m=>`<li style="font-size:12px;color:var(--text-dim);padding:2px 0 2px 14px;
            border-left:2px solid var(--yellow)">• ${escHtml(m)}</li>`).join('')}
        </ul>
      </div>`:''}
      <div class="flex gap-sm" style="flex-wrap:wrap">
        <button class="btn btn-sm btn-ghost"
          onclick="closeProposalPanel();switchTab('reviews')"
          title="Go to Reviews tab to add more findings">
          📝 Complete Review
        </button>
        <button class="btn btn-sm"
          style="background:var(--yellow);color:#000"
          onclick="_ppMarkInterimAndGenerate('${escHtml(rid)}','${escHtml(pid)}','${escHtml(vid||'')}')">
          ⚡ Mark as Draft &amp; Generate
        </button>
      </div>
      <p style="font-size:10px;color:var(--text-muted);margin-top:8px">
        "Mark as Draft" acknowledges the review is partial. You can complete it later.
      </p>
    </div>`;
}

// Interim override: mark review as interim, then generate with force=true
async function _ppMarkInterimAndGenerate(rid, pid, vid){
  const body=document.getElementById('pp-body');

  // Prompt for name
  const name=prompt('Enter your name to save this review as Draft (interim):','');
  if(!name||!name.trim()){ toast('Name required','err'); return; }

  // Mark as interim
  const mc=await api('POST',`/api/projects/${pid}/hierarchy/reviews/${rid}/complete`,
    {completed_by:name.trim(), quality_status:'interim'});
  if(mc.error){ toast(mc.error,'err'); return; }
  toast('Review marked as Draft');

  // Update state so header CTA stays enabled
  state._dashReview=rid;
  state._dashVersion=vid||state._dashVersion;

  // Now regenerate with force=true
  document.getElementById('pp-force-chk').checked=true;
  _ppSetLoading(true);
  if(body) body.innerHTML=`<div style="display:flex;align-items:center;gap:8px;padding:20px;color:var(--text-dim)">
    <span class="spin">⟳</span> Generating with Draft status…</div>`;
  await _runGenerateProposal();
}

// ── Loading state ─────────────────────────────────────────────
function _ppSetLoading(on){
  _pp.loading = on;
  const btn = document.getElementById('pp-gen-btn');
  const status = document.getElementById('pp-status');
  if(btn){ btn.disabled = on; btn.textContent = on?'⏳ Generating…':'⚡ Generate'; }
  if(on){
    const body = document.getElementById('pp-body');
    if(body) body.innerHTML=`<div class="pp-loading">
      <span class="pp-spin">⟳</span>
      <span>Generating proposal document…</span>
      <span style="font-size:11px;color:var(--text-muted)">This may take a moment</span>
    </div>`;
    if(status) status.textContent='Running…';
  }else{
    if(status) status.textContent='';
    // Re-enable button only if review is still selected
    if(btn&&getReviewId()) btn.disabled=false;
  }
}

// ── Error display ─────────────────────────────────────────────
function _ppSetError(msg){
  _pp.error = msg;
  const bar = document.getElementById('pp-error-bar');
  if(!bar) return;
  bar.innerHTML = msg
    ? `<div class="pp-err">⚠ ${escHtml(msg)}</div>`
    : '';
}

// ── Render proposal document ──────────────────────────────────
function _renderProposalDoc(doc){
  const body = document.getElementById('pp-body');
  if(!body) return;
  if(!doc){ body.innerHTML='<div class="pp-empty"><div class="pp-empty-icon">⚠</div><p>No document data returned.</p></div>'; return; }

  // Normalise: response is {document:{...}} from POST /proposal/generate
  const d = doc.document || doc;

  // ── Section helpers ───────────────────────────────────────
  function _sec(id, icon, title, bodyHtml, defaultOpen=true){
    return`<div class="pp-section ${defaultOpen?'open':''}" id="pp-sec-${id}">
      <div class="pp-section-head" onclick="_ppToggleSec('pp-sec-${id}')">
        <span class="pp-section-icon">${icon}</span>
        <span class="pp-section-title">${title}</span>
        <span class="pp-section-chevron">▶</span>
      </div>
      <div class="pp-section-body">${bodyHtml}</div>
    </div>`;
  }

  function _list(items, markerClass, fallback='None recorded'){
    if(!items||!items.length) return`<p style="font-size:12px;color:var(--text-muted);font-style:italic">${fallback}</p>`;
    return`<ul class="pp-list">${items.map(i=>
      `<li><span class="pp-list-marker ${markerClass}"></span>${escHtml(String(i))}</li>`
    ).join('')}</ul>`;
  }

  function _text(val, fallback='Not available'){
    if(!val) return`<p style="font-size:12px;color:var(--text-muted);font-style:italic">${fallback}</p>`;
    return`<p style="white-space:pre-line;font-size:12px;color:var(--text-dim)">${escHtml(String(val))}</p>`;
  }

  // ── 1. Executive Summary ──────────────────────────────────
  // ProposalDocument field: exec_summary
  const sec1 = _sec('exec','📋','Executive Summary', _text(d.exec_summary||''));

  // ── 2. Scope ──────────────────────────────────────────────
  // ProposalDocument field: scope (plain text)
  const sec2 = _sec('approach','🏗','Scope', _text(d.scope||''));

  // ── 3. Delivery Phases ────────────────────────────────────
  // ProposalDocument field: delivery_phases [{phase, description, duration_weeks}]
  const phases = d.delivery_phases || [];
  const phasesHtml = phases.length
    ? `<div style="display:flex;flex-direction:column;gap:6px">${phases.map(p=>`
        <div style="background:var(--surface2);border-radius:var(--radius);padding:8px 10px">
          <div style="font-weight:700;font-size:12px;color:var(--accent)">${escHtml(p.phase||'')}</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:2px">${escHtml(p.description||'')}
            ${p.duration_weeks?`<span style="color:var(--text-muted);margin-left:6px">(${p.duration_weeks}w)</span>`:''}
          </div>
        </div>`).join('')}</div>`
    : `<p style="font-size:12px;color:var(--text-muted);font-style:italic">No phases defined</p>`;
  const sec3 = _sec('phases','🚀','Delivery Phases', phasesHtml);

  // ── 4. Risks ──────────────────────────────────────────────
  // ProposalDocument field: risks [{risk, category, impact, probability, mitigation}]
  const risks = d.risks || [];
  const risksHtml = risks.length
    ? `<div style="display:flex;flex-direction:column;gap:6px">${risks.map(r=>{
        const impactColour = r.impact==='high'?'var(--red)':r.impact==='medium'?'var(--yellow)':'var(--green)';
        return`<div style="background:var(--surface2);border-radius:var(--radius);padding:8px 10px;
                  border-left:3px solid ${impactColour}">
          <div style="font-size:12px;color:var(--text)">${escHtml(r.risk||String(r))}</div>
          ${r.category||r.impact?`<div style="font-size:10px;color:var(--text-muted);margin-top:3px">
            ${r.category?`<span style="text-transform:uppercase;letter-spacing:.4px">${escHtml(r.category)}</span>`:''}
            ${r.impact?`· impact: <strong style="color:${impactColour}">${escHtml(r.impact)}</strong>`:''}
            ${r.probability?`· prob: ${escHtml(r.probability)}`:''}
          </div>`:''}
          ${r.mitigation?`<div style="font-size:11px;color:var(--text-dim);margin-top:4px;font-style:italic">${escHtml(r.mitigation)}</div>`:''}
        </div>`;}).join('')}</div>`
    : `<p style="font-size:12px;color:var(--text-muted);font-style:italic">No risks recorded</p>`;
  const sec4 = _sec('risks','⚠️','Risks', risksHtml, false);

  // ── 5. Assumptions ────────────────────────────────────────
  // ProposalDocument field: assumptions [{assumption, category}]
  const assumptions = d.assumptions || [];
  const assumptionTexts = assumptions.map(a=>
    typeof a === 'string' ? a : (a.assumption ? `[${a.category||'general'}] ${a.assumption}` : String(a))
  );
  const sec5 = _sec('assumptions','💡','Assumptions', _list(assumptionTexts,'pp-confirmed','No assumptions recorded'), false);

  // ── 6. Exclusions & Acceptance Criteria ───────────────────
  // ProposalDocument fields: exclusions [str], acceptance_criteria [str]
  const exclusions = d.exclusions || [];
  const acceptance = d.acceptance_criteria || [];
  const exclHtml = `
    ${exclusions.length?`<p style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:4px">Exclusions</p>`+_list(exclusions,'pp-risk'):''}
    ${acceptance.length?`<p style="font-size:11px;font-weight:700;color:var(--text-muted);margin-top:${exclusions.length?10:0}px;margin-bottom:4px">Acceptance Criteria</p>`+_list(acceptance,'pp-action'):''}
    ${!exclusions.length&&!acceptance.length?`<p style="font-size:12px;color:var(--text-muted);font-style:italic">None recorded</p>`:''}`;
  const sec6 = _sec('excl','📋','Exclusions &amp; Acceptance Criteria', exclHtml, false);

  // ── 7. Coverage (when present — multi-review path) ────────
  // ProposalDocument field: proposal_coverage {scope:{status,matched_themes,gap_notes}, …}
  const covObj = d.proposal_coverage;
  const DOMAINS = ['scope','architecture','delivery','security_compliance','operations','commercials'];
  const DOMAIN_LABELS = {scope:'Scope',architecture:'Architecture',delivery:'Delivery',
    security_compliance:'Security/Compliance',operations:'Operations',commercials:'Commercials'};
  const statusColour = s => s==='Addressed'?'var(--green)':s==='Partial'?'var(--yellow)':'var(--text-muted)';
  const covHtml = covObj
    ? `<div class="pp-coverage-grid">${DOMAINS.map(k=>{
        const dom = covObj[k]||{};
        const status = dom.status||'Not Yet Addressed';
        return`<div class="pp-coverage-item">
          <div class="pp-coverage-label">${escHtml(DOMAIN_LABELS[k])}</div>
          <div class="pp-coverage-val" style="color:${statusColour(status)}">${escHtml(status)}</div>
          ${dom.gap_notes?`<div style="font-size:10px;color:var(--text-muted);margin-top:2px">${escHtml(dom.gap_notes)}</div>`:''}
        </div>`;}).join('')}</div>
        ${covObj.source_theme_count?`<p style="font-size:10px;color:var(--text-muted);margin-top:8px">${covObj.source_theme_count} source theme(s) analysed</p>`:''}`
    : `<p style="font-size:12px;color:var(--text-muted);font-style:italic">Coverage analysis not available (single-review mode)</p>`;
  const sec7 = _sec('coverage','📊','Coverage Analysis', covHtml, false);

  // ── Metadata footer ───────────────────────────────────────
  const created  = d.generated_at || '';
  const docId    = d.doc_id || '';
  const backend  = d.ai_backend || '';
  const metaFooter = `<div class="pp-meta-footer">
    ${docId?`<span>doc: ${escHtml(docId)}</span>`:''}
    ${backend?`<span>mode: ${escHtml(backend)}</span>`:''}
    ${created?`<span>Generated: ${fmtDate(created)}</span>`:''}
    <span style="margin-left:auto">project: ${escHtml(getProjectId()||'–')} · review: ${escHtml(getReviewId()||'–')}</span>
  </div>`;

  body.innerHTML = sec1+sec2+sec3+sec4+sec5+sec6+sec7+metaFooter;
}

// ── Toggle a proposal section ─────────────────────────────────
function _ppToggleSec(secId){
  const el = document.getElementById(secId);
  if(el) el.classList.toggle('open');
}
</script>
