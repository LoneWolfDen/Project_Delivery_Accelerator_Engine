function switchIngestTab(tab){
  ['upload','paste','paths'].forEach(t=>{
    const el=document.getElementById('ingest'+t[0].toUpperCase()+t.slice(1));
    const btn=document.getElementById('tab'+t[0].toUpperCase()+t.slice(1));
    if(el)el.style.display=t===tab?'':'none';
    if(btn){btn.className='btn btn-sm '+(t===tab?'':'btn-ghost');}
  });
  if(tab==='upload')renderMetadataFields('upload');
  if(tab==='paste')renderMetadataFields('paste');
}
</script>


<script>
// ─── Metadata fields helpers ─────────────────────────────────────────────────
function renderMetadataFields(prefix){
  const catEl=document.getElementById(prefix+'Category');
  const cnt=document.getElementById(prefix+'MetaFields');
  if(!catEl||!cnt)return;
  const fields=CATEGORY_META_SCHEMA[catEl.value]||[];
  if(!fields.length){cnt.innerHTML='';return;}
  let html=`<div style="border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin:6px 0 8px;background:var(--bg)">
    <p class="card-section" style="margin-top:0">Context Fields</p>`;
  for(const f of fields){
    const id=`${prefix}_meta_${f.name}`;
    const req=f.required?` <span style="color:var(--red)">*</span>`:'';
    if(f.type==='enum'){
      html+=`<div class="form-row"><label>${f.label}${req}</label><select id="${id}"><option value="">— select —</option>${f.options.map(o=>`<option value="${o}">${o.replace(/_/g,' ')}</option>`).join('')}</select></div>`;
    }else if(f.type==='date'){
      html+=`<div class="form-row"><label>${f.label}${req}</label><input id="${id}" type="date"></div>`;
    }else if(f.type==='array'){
      html+=`<div class="form-row"><label>${f.label}${req}</label><input id="${id}" placeholder="e.g. Alice, Bob"></div>`;
    }else{
      html+=`<div class="form-row"><label>${f.label}${req}</label><input id="${id}" placeholder="${f.label}"></div>`;
    }
  }
  html+='</div>';
  cnt.innerHTML=html;
}
function collectMetadata(prefix){
  const catEl=document.getElementById(prefix+'Category');
  if(!catEl)return{};
  const fields=CATEGORY_META_SCHEMA[catEl.value]||[];
  const md={};
  for(const f of fields){
    const el=document.getElementById(`${prefix}_meta_${f.name}`);
    if(!el)continue;
    const v=el.value.trim();
    if(!v)continue;
    md[f.name]=f.type==='array'?v.split(',').map(s=>s.trim()).filter(Boolean):v;
  }
  return md;
}
function validateMetadata(prefix){
  const catEl=document.getElementById(prefix+'Category');
  if(!catEl)return{valid:true,errors:[]};
  const fields=CATEGORY_META_SCHEMA[catEl.value]||[];
  const errors=[];
  for(const f of fields){
    if(!f.required)continue;
    const el=document.getElementById(`${prefix}_meta_${f.name}`);
    if(!el||!el.value.trim())errors.push(`${f.label} is required`);
  }
  return{valid:errors.length===0,errors};
}

async function doUploadArtifact(){
  const pid=state.current.id;
  const fi=document.getElementById('uploadFile');
  const cat=document.getElementById('uploadCategory').value;
  const title=document.getElementById('uploadTitle').value;
  const el=document.getElementById('ingestResult');
  if(!fi.files.length){el.innerHTML='<p style="color:var(--red)">Select a file</p>';return;}
  if(!cat){el.innerHTML='<p style="color:var(--red)">Category required</p>';return;}
  const{valid,errors}=validateMetadata('upload');
  if(!valid){el.innerHTML=`<p style="color:var(--red)">${errors.join('<br>')}</p>`;return;}
  const md=collectMetadata('upload');
  const file=fi.files[0];
  el.innerHTML='<span class="loading-inline"><span class="spin">⟳</span> Uploading…</span>';
  const fd=new FormData();
  fd.append('file',file);fd.append('category',cat);
  if(title)fd.append('title',title);
  if(Object.keys(md).length)fd.append('metadata',JSON.stringify(md));
  try{
    const resp=await fetch(`/api/v1/projects/${pid}/artifacts/upload`,{method:'POST',body:fd});
    const r=await resp.json();
    if(r.artifact){
      toast(`Uploaded: ${r.artifact.title||r.artifact.fileName}`);
      el.innerHTML='';fi.value='';document.getElementById('uploadTitle').value='';
      setTimeout(()=>render(),600);
    }else{el.innerHTML=`<p style="color:var(--red)">${r.error||'Upload failed'}</p>`;}
  }catch(ex){el.innerHTML=`<p style="color:var(--red)">${ex.message}</p>`;}
}

async function doPasteArtifact(){
  const pid=state.current.id;
  const cat=document.getElementById('pasteCategory').value;
  const title=document.getElementById('pasteTitle').value;
  const text=document.getElementById('pasteText').value;
  const el=document.getElementById('ingestResult');
  if(!text.trim()){el.innerHTML='<p style="color:var(--red)">Text required</p>';return;}
  if(!cat){el.innerHTML='<p style="color:var(--red)">Category required</p>';return;}
  const{valid,errors}=validateMetadata('paste');
  if(!valid){el.innerHTML=`<p style="color:var(--red)">${errors.join('<br>')}</p>`;return;}
  const md=collectMetadata('paste');
  el.innerHTML='<span class="loading-inline"><span class="spin">⟳</span> Saving…</span>';
  const r=await api('POST',`/api/v1/projects/${pid}/artifacts/text`,{category:cat,title,text,metadata:md});
  if(r.artifact){
    toast(`Saved: ${r.artifact.title}`);
    el.innerHTML='';document.getElementById('pasteText').value='';document.getElementById('pasteTitle').value='';
    setTimeout(()=>render(),600);
  }else{el.innerHTML=`<p style="color:var(--red)">${r.error||r.message||'Save failed'}</p>`;}
}

async function toggleArtifact(pid,id,inc){
  const pill=document.querySelector(`.toggle-pill[data-aid="${id}"]`);
  if(pill&&pill.dataset.busy==='1')return;
  if(pill)pill.dataset.busy='1';
  const r=await api('POST',`/api/v1/projects/${pid}/artifacts/${id}/toggle`,{include:inc});
  if(pill)delete pill.dataset.busy;
  if(r.error){toast(r.error,'err');return;}
  if(pill){
    pill.className='toggle-pill '+(inc?'toggle-on':'toggle-off');
    pill.textContent=inc?'Included':'Excluded';
    pill.setAttribute('onclick',`event.stopPropagation();toggleArtifact('${pid}','${id}',${!inc})`);
  }
  _updateIngestCounter();
}

function _updateIngestCounter(){
  const pills=document.querySelectorAll('.toggle-pill[data-aid]');
  const inc=[...pills].filter(p=>p.classList.contains('toggle-on')).length;
  const tot=pills.length;
  const legacyCount=document.querySelectorAll('.toggle-pill[data-legacy]').length;
  const legacyInc=document.querySelectorAll('.toggle-pill[data-legacy].toggle-on').length;
  const total=tot+legacyCount;
  const included=inc+legacyInc;
  const badge=document.getElementById('ingestCountBadge');
  if(badge&&total){
    badge.textContent=`${included}/${total} included`;
    badge.className='tag '+(included===total?'tag-green':included===0?'tag-red':'tag-yellow');
  }
}

async function deleteArtifact(pid,id){
  if(!confirm('Remove this artefact?'))return;
  await api('POST',`/api/v1/projects/${pid}/artifacts/${id}/delete`,{});
  toast('Artefact removed');render();
}
async function processArtifact(pid,id){
  const r=await api('POST',`/api/v1/projects/${pid}/artifacts/${id}/process`,{});
  if(r.job){toast(`Processing queued (${r.job.jobId})`);setTimeout(()=>render(),500);}
  else toast(r.error||'Processing failed','err');
}
async function processAllArtifacts(){
  const pid=state.current.id;
  const r=await api('POST',`/api/v1/projects/${pid}/artifacts/process`,{onlyIncluded:true,force:true});
  if(r.queuedArtifactIds){
    const n=r.queuedArtifactIds.length;
    toast(n===0?'No included artefacts to process.':`Re-processed ${n} artefact${n===1?'':'s'} ✓`);
    setTimeout(()=>render(),600);
  }else{
    toast(r.error||r.message||'Processing failed','err');
  }
}
async function toggleFileActive(fname,active){
  await api('POST',`/api/projects/${state.current.id}/toggle-file`,{filename:fname,active});render();
}
async function doIngest(){
  const paths=document.getElementById('ingestPathsArea').value.split('\n').map(p=>p.trim()).filter(Boolean);
  if(!paths.length)return;
  const r=await api('POST','/api/ingest',{project_id:state.current.id,file_paths:paths});
  let html=`<div class="card"><div class="card-title">Ingested: ${r.ingested||0} file(s)</div>`;
  if(r.documents)html+=`<ul class="items">${r.documents.map(d=>`<li>✓ ${escHtml(d.filename)} (${d.source_type}, ${d.sections} sections)</li>`).join('')}</ul>`;
  if(r.errors?.length)html+=`<p style="color:var(--red);margin-top:6px">${r.errors.map(e=>`✗ ${escHtml(e.file)}: ${escHtml(e.error)}`).join('<br>')}</p>`;
  if(r.error)html+=`<p style="color:var(--red)">${r.error}</p>`;
  html+='</div>';
  document.getElementById('ingestResult').innerHTML=html;
}

function toggleFileExpand(headerOrNull,btnId){
  if(headerOrNull){
    // single file-item expand
    const item=headerOrNull.closest('.file-item');
    if(item)item.classList.toggle('expanded');
    return;
  }
  // toggle all
  const btn=btnId?document.getElementById(btnId):null;
  const isExpanded=btn&&btn.textContent.trim()==='Collapse All';
  document.querySelectorAll('.file-item').forEach(el=>{
    if(isExpanded)el.classList.remove('expanded');
    else el.classList.add('expanded');
  });
  if(btn)btn.textContent=isExpanded?'Expand All':'Collapse All';
}

function toggleExpandSection(sel,btnId){
  const btn=document.getElementById(btnId);
  const isExpanded=btn&&btn.textContent.trim()==='Collapse All';
  document.querySelectorAll(sel).forEach(el=>{
    if(el.tagName==='DETAILS')el.open=!isExpanded;
    else{if(isExpanded)el.classList.remove('expanded');else el.classList.add('expanded');}
  });
  if(btn)btn.textContent=isExpanded?'Expand All':'Collapse All';
}
</script>


<script>
// ── Build / Rebuild context ──────────────────────────────────────────────────
async function buildContext(){
  if(!state.current)return;
  let nextNum=1;
  try{const r=await api('GET',`/api/projects/${state.current.id}/hierarchy/versions`);nextNum=(r.versions||[]).length+1;}catch(e){}
  const label=prompt(`Label this version (optional, max 20 chars).\nWill create: v${nextNum} – [label]`,'');
  if(label===null)return;
  const trimmed=(label||'').trim().slice(0,20);
  const sel=document.getElementById('intelBackendSelect');
  const selectedBackend=sel?sel.value:(state.current.ai_backend||'files_only');
  const payload={};
  if(trimmed)payload.label=trimmed;
  payload.ai_backend=selectedBackend;
  const r=await api('POST',`/api/projects/${state.current.id}/build-context`,payload);
  if(r._build_metadata){
    const meta=r._build_metadata;
    const aiTag=meta.ai_enriched?` ✨ AI (${meta.ai_backend})`:'';
    toast(`Built v${nextNum}${aiTag}: ${meta.total_risks||0} risks, ${meta.total_constraints||0} constraints`);
    render();
  }else if(r.error){toast(r.error,'err');}
}

async function rebuildContext(){
  if(!state.current)return;
  const sel=document.getElementById('intelBackendSelect');
  const selectedBackend=sel?sel.value:(state.current.ai_backend||'files_only');
  const payload={ai_backend:selectedBackend};
  const r=await api('POST',`/api/projects/${state.current.id}/build-context`,payload);
  if(r._build_metadata){
    const meta=r._build_metadata;
    const aiTag=meta.ai_enriched?` ✨ AI (${meta.ai_backend})`:'';
    toast(`Rebuilt${aiTag}: ${meta.total_risks||0} risks, ${meta.total_constraints||0} constraints`);
    render();
  }else if(r.error){toast(r.error,'err');}
}

function goToBuildIntelligence(){
  switchTab('ingest');
  setTimeout(()=>{
    const cards=document.querySelectorAll('.card');
    for(const c of cards){
      const title=c.querySelector('.card-title');
      if(title&&title.textContent.includes('Build Intelligence')){
        c.scrollIntoView({behavior:'smooth',block:'start'});
        break;
      }
    }
  },150);
}
</script>


<script>
// ── SETTINGS VIEW ────────────────────────────────────────────────────────────
async function viewSettings(){
  const r=await api('GET','/api/projects/all');

  let maxProjects=5;
  try{const c=await api('GET','/api/admin/config');maxProjects=c.config?.max_active_projects||5;}catch(e){}
  const activeCnt=(state.allProjects||state.projects).filter(p=>p.status!=='archived'&&p.status!=='deleted').length;
  const atLimit=activeCnt>=maxProjects;

  const createCard=`<div class="card">
    <div class="card-title mb"><span class="icon">➕</span>Create New Project</div>
    ${atLimit?`<p style="color:var(--red);font-size:12px;margin-bottom:8px">Limit reached: ${activeCnt}/${maxProjects}. Archive or delete a project first.</p>`
      :`<p class="card-subtitle">Active: ${activeCnt}/${maxProjects}</p>`}

    <div class="form-row"><label>Description</label><input id="newDesc" placeholder="Optional"></div>
    <button class="btn" onclick="createProject()" ${atLimit?'disabled':''}>Create Project</button>

  const actCard=state.current?`<div class="card">
    <div class="card-title mb"><span class="icon">🗑️</span>Project Actions</div>
    <p class="card-subtitle">Current: <strong>${escHtml(state.current.name)}</strong> (${state.current.id})</p>
    <div class="flex gap-sm">
      <button class="btn btn-sm btn-yellow" onclick="archiveProject()">Archive Project</button>
      <button class="btn btn-sm btn-red" onclick="deleteProject()">Delete Project</button>
    </div>
    <p style="font-size:10px;color:var(--text-muted);margin-top:6px">Requires admin PIN (set via <code>ADMIN_PIN</code> env var)</p>
  </div>`:'';

  const allCard=(state.allProjects||[]).length?`<div class="card">
    <div class="card-title mb"><span class="icon">📂</span>All Projects</div>
    <ul class="items">${(state.allProjects||[]).map(p=>`<li>
      <a href="#" onclick="selectProjectFromSettings('${p.id}')">${escHtml(p.name)}</a>
      <span class="tag" style="margin-left:4px">${p.phase||'–'}</span>
      <span class="fs10 c-muted">${p.file_count||0} files</span>
      ${p.status==='archived'?'<span class="tag tag-yellow" style="margin-left:4px">archived</span>':''}
    </li>`).join('')}</ul>
  </div>`:'';

  const bkCard=`<div class="card">
    <div class="card-title mb"><span class="icon">🤖</span>AI Backends</div>
    <div class="backend-grid">${(state.backends||[]).map(b=>`<div class="backend-chip ${b.available?'ok':''}">
      ${b.available?'●':'○'} <strong>${b.name}</strong><br><span style="font-size:10px">${escHtml(b.display_name||b.name)}</span>
    </div>`).join('')}</div>
    <p style="font-size:11px;color:var(--text-muted);margin-top:8px">
      Set via env vars: GROQ_API_KEY · OPENROUTER_API_KEY · GEMINI_API_KEY · AWS credentials
    </p>
  </div>`;

  return createCard+actCard+allCard+bkCard;
}

// FIX #8: selectProjectFromSettings does NOT reset tab (preserves current tab)
function selectProjectFromSettings(id){
  state.current=state.projects.find(x=>x.id===id)||state.current;
  try{localStorage.setItem('pdae_current_project_id',state.current.id);}catch(e){}
  state._dashVersion='';state._dashReview='';
  // Keep current tab (do not force to dashboard) when called from settings
  render();
}

async function archiveProject(pid){
  const id=pid||state.current?.id;if(!id)return;
  const pin=prompt('Enter PIN to archive:');if(!pin)return;
  const r=await api('POST',`/api/projects/${id}/archive`,{pin});
  if(r.error){toast(r.error,'err');return;}
  toast(r.message||'Archived');
  await loadProjects();state.current=state.projects[0]||null;state.tab='dashboard';render();
}
async function deleteProject(){
  if(!state.current)return;
  if(!confirm(`Permanently delete "${state.current.name}"?`))return;
  const pin=prompt('Enter PIN to delete:');if(!pin)return;
  const r=await api('POST',`/api/projects/${state.current.id}/delete`,{pin});
  if(r.error){toast(r.error,'err');return;}
  toast(r.message||'Deleted');
  await loadProjects();state.current=state.projects[0]||null;state.tab='dashboard';render();
}
</script>

  const configCard=`<div class="card">
    <div class="card-title mb"><span class="icon">⚙️</span>Configuration</div>

          ${['solution_architect','delivery_manager','product_owner','resource_manager'].map(p=>`<option value="${p}" ${config.default_persona===p?'selected':''}>${p.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</option>`).join('')}

    personaPromptsCard=`<div class="card">

      ${groupRows}
      <div class="flex gap-sm mt">
        <button class="btn" onclick="savePersonaPrompts()">Save Persona Prompts</button>
      </div>
      <div id="personaPromptsResult" class="mt"></div>
    </div>`;
  }catch(e){personaPromptsCard='';}

  return healthCard+storageCard+configCard+personaPromptsCard+lifecycleCard+suggestCard;
}

async function saveAdminConfig(){
  const up={
    max_active_projects:parseInt(document.getElementById('cfgMaxP').value)||5,
    default_persona:document.getElementById('cfgPersona').value,
    admin_pin:document.getElementById('cfgPin').value,
    sqlite_write_enabled:document.getElementById('cfgSqlite')?.checked!==false,
    file_write_enabled:document.getElementById('cfgFileWrite')?.checked!==false,
    api_keys:{}
  };
  const g=document.getElementById('cfgGroq').value;
  const o=document.getElementById('cfgOR').value;
  const gm=document.getElementById('cfgGemini').value;
  if(g)up.api_keys.groq=g;
  if(o)up.api_keys.openrouter=o;
  if(gm)up.api_keys.gemini=gm;
  const r=await api('POST','/api/admin/config',up);
  if(r.config){toast('Configuration saved');document.getElementById('configResult').innerHTML=`<p style="color:var(--green)">✓ Saved</p>`;}
  else{toast(r.error||'Save failed','err');}
}

async function savePersonaPrompts(){
  const tas=document.querySelectorAll('textarea[data-group-id]');
  if(!tas.length){toast('No prompt editors found','err');return;}
  const persona_prompts={};
  for(const ta of tas){
    const gid=ta.dataset.groupId||ta.getAttribute('data-group-id');
    const yamlDefault=ta.dataset.yamlDefault||ta.getAttribute('data-yaml-default')||'';
    const val=ta.value;
    if(val.trim()&&val.trim()!==yamlDefault.trim())persona_prompts[gid]=val;
    else persona_prompts[gid]=null;
  }
  const r=await api('POST','/api/admin/config',{persona_prompts});
  const el=document.getElementById('personaPromptsResult');
  if(r.config){
    toast('Persona prompts saved');
    if(el)el.innerHTML='<p style="color:var(--green);font-size:12px">✓ Saved</p>';
    setTimeout(()=>render(),800);
  }else{
    toast(r.error||'Save failed','err');
    if(el)el.innerHTML=`<p style="color:var(--red);font-size:12px">${escHtml(r.error||'Save failed')}</p>`;
  }
}

function resetPersonaPrompt(groupId){
  const ta=document.getElementById('pp_'+groupId);
  if(!ta)return;
  const yamlDefault=ta.dataset.yamlDefault||ta.getAttribute('data-yaml-default')||'';
  ta.value=yamlDefault;
  ta.style.borderColor='var(--border)';
  toast('Reset to YAML default — click Save Persona Prompts to persist');
}

async function restoreProject(pid){
  const pin=prompt('Enter PIN to restore:');if(!pin)return;
  const r=await api('POST',`/api/projects/${pid}/restore`,{pin});
  if(r.error){toast(r.error,'err');return;}
  toast(r.message||'Project restored');
  await loadProjects();render();
}
</script>


<script>
// ── Project actions ───────────────────────────────────────────────────────────
// FIX #8: selectProject resets tab to dashboard (called from header dropdown)
async function selectProject(id){
  state.current=state.projects.find(x=>x.id===id)||state.current;
  try{localStorage.setItem('pdae_current_project_id',state.current.id);}catch(e){}
  state._dashVersion='';state._dashReview='';
  state.tab='dashboard';render();
}

// FIX #8: createProject uses newDesc if present
async function createProject(){
  const name=(document.getElementById('newName')?.value||'').trim();
  const desc=(document.getElementById('newDesc')?.value||'').trim();
  if(!name)return;
  const r=await api('POST','/api/projects',{name,description:desc||undefined});
  if(r.project){
    await loadProjects();
    state.current=state.projects.find(p=>p.id===r.project.id)||r.project;
    state.tab='dashboard';toast(`Project "${name}" created`);render();
  }else{
    const el=document.getElementById('createProjectError');
    if(el)el.innerHTML=`<p style="color:var(--red);font-size:12px;margin-top:6px">${escHtml(r.error||'Failed')}</p>`;
    else toast(r.error||'Failed','err');
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function loadProjects(){
  const r=await api('GET','/api/projects');
  state.projects=r.projects||[];
  if(!state.current&&state.projects.length){
    let restoredId=null;
    try{restoredId=localStorage.getItem('pdae_current_project_id');}catch(e){}
    const found=restoredId&&state.projects.find(x=>x.id===restoredId);
    state.current=found||state.projects[0];
  }
}

async function loadBackends(){
  const r=await api('GET','/api/backends');
  state.backends=r.backends||[];
}

async function loadAppInfo(){
  try{
    const h=await api('GET','/api/health');
    if(h.app){state.appName=h.app;document.title=`${h.app} v2`;}
  }catch(e){}
}

(async()=>{
  await Promise.all([loadProjects(),loadBackends(),loadAppInfo()]);
  render();
})();
</script>
